<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Jeff Franzen’s four-day interactive course in measurement, mapping, and GIS decisions.">
<!-- Continuity: franzenjb/faria-learning-log · handoff.jbf.com -->
<link rel="author" href="https://handoff.jbf.com/">
<title>Where Am I? · Faria GIS Classroom</title>
<link rel="stylesheet" href="style.css">
<script defer src="source-data.js"></script>
<script defer src="labs.js"></script>
<script defer src="course.js"></script>
</head>
<body>
<header class="bar">
  <button id="index-toggle" aria-controls="index" aria-expanded="false">Slide Index <kbd>L</kbd></button>
  <a class="brand" href="#p1">FARIA <span> / </span> GIS CLASSROOM</a>
  <button id="menu-open">Course Menu <kbd>M</kbd></button>
  <button id="focus-toggle" aria-pressed="false">Focus <kbd>F</kbd></button>
  <button id="topics-toggle" aria-controls="topics" aria-expanded="false">Topics <kbd>R</kbd></button>
</header>
<div class="workspace">
  <aside id="index" class="rail" hidden aria-label="Slide Index"><h2>Slide Index</h2><nav id="index-list" aria-label="Day Slides"></nav></aside>
  <main id="stage">
    <section id="cover" class="cover" aria-labelledby="cover-title" hidden>
      <div class="cover-earth" aria-hidden="true"></div>
      <div class="cover-copy">
        <h1 id="cover-title" tabindex="-1">Where Am I?</h1>
        <p>Measurement, mapping, and disaster decisions</p>
        <p class="cover-credit">Jeff Franzen · Four-Day GIS Course</p>
        <button id="begin-quiz">Start The Map Quiz <span aria-hidden="true">→</span></button>
      </div>
      <a class="earth-credit" href="https://science.nasa.gov/resource/blue-marble-2002/" target="_blank" rel="noopener">Earth Imagery · NASA Earth Observatory</a>
    </section>
    <article class="prompt">
      <p class="course-name">Where Am I?</p>
      <p id="chapter" class="chapter"></p>
      <h1 id="title" tabindex="-1"></h1>
      <p id="prompt"></p>
      <section id="notes" aria-label="Presenter Notes" hidden><h2>Presenter Notes</h2><div id="notes-text"></div></section>
    </article>
    <section class="visual" aria-label="Slide Visual">
      <div class="visual-head"><span id="visual-label"></span><button id="return" hidden>Return To Slide</button></div>
      <div id="visual"></div>
    </section>
  </main>
  <aside id="topics" class="rail" hidden aria-label="Related Topics"><h2>Related Topics</h2><div id="topics-list"></div></aside>
</div>
<footer class="transport">
  <div><span id="progress" aria-live="polite"></span><span id="source-label"></span></div>
  <div class="step"><button id="keys-open">Keys <kbd>?</kbd></button><button id="prev">Previous</button><button id="next">Next</button></div>
</footer>
<dialog id="menu" aria-labelledby="menu-title">
  <div class="dialog-head"><h2 id="menu-title">Course Menu</h2><form method="dialog"><button aria-label="Close Course Menu">Close</button></form></div>
  <label class="search">Find A Slide <input id="search" type="search" placeholder="Try longitude or shelter"></label>
  <nav id="menu-list" aria-label="All Course Slides"></nav>
</dialog>
<dialog id="keys" aria-labelledby="keys-title">
  <div class="dialog-head"><h2 id="keys-title">Classroom Keys</h2><form method="dialog"><button>Close</button></form></div>
  <dl id="key-list"></dl>
</dialog>
</body>
</html>
