<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>What Is Longitude? · Three Ways</title>
<style>
  :root { --bg:#070b16; --ink:#ece6da; --gold:#f0b35a; --mute:#c2bba9; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:Georgia,serif; overflow:hidden; -webkit-tap-highlight-color:transparent; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #bar { position:fixed; bottom:12px; left:50%; transform:translateX(-50%); display:flex; gap:6px; z-index:5; opacity:.55; transition:opacity .2s; }
  #bar:hover { opacity:1; }
  #bar a { font:13px system-ui,sans-serif; color:var(--ink); text-decoration:none; padding:5px 10px; border:1px solid #2e3854; border-radius:6px; background:rgba(10,14,26,.7); }
  #bar a.on { border-color:var(--gold); color:var(--gold); }
  #nav { position:fixed; right:14px; bottom:12px; display:flex; gap:6px; z-index:5; }
  #nav button { font:16px system-ui,sans-serif; color:var(--ink); background:rgba(10,14,26,.8); border:1px solid #2e3854; border-radius:8px; padding:8px 14px; cursor:pointer; }
  #pos { position:fixed; left:14px; bottom:16px; font:13px ui-monospace,monospace; color:#8b8576; z-index:5; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bar"><a href="?v=a" data-v="a">A · Nature's Line, Our Line</a><a href="?v=b" data-v="b">B · The Earth Is a Clock</a><a href="?v=c" data-v="c">C · Two Questions, 2,000 Years Apart</a></div>
<div id="pos"></div>
<div id="nav"><button id="prev">←</button><button id="next">→</button></div>
<script src="../coast.js"></script>
<script>
/* One 1600×1000 stage, scaled to fit. Three versions of the same lesson: ?v=a, ?v=b, ?v=c. → or a tap steps each one. */
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), D = Math.PI / 180;
const G = '#f0b35a', W = '#ece6da', M = '#c2bba9', B = '#6fb3ff', RED = '#ff7d6f';
let sc = 1, ox = 0, oy = 0;
const fit = () => { const dpr = devicePixelRatio || 1; cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; sc = Math.min(innerWidth / 1600, innerHeight / 1000); ox = (innerWidth - 1600 * sc) / 2; oy = (innerHeight - 1000 * sc) / 2; ctx.setTransform(dpr * sc, 0, 0, dpr * sc, dpr * ox, dpr * oy); };
addEventListener('resize', fit); fit();
const clamp = v => Math.max(0, Math.min(1, v)), ease = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }, lerp = (a, b, t) => a + (b - a) * t;

// text with a soft shadow; shrinks to fit maxW
const text = (s, x, y, px, col = W, align = 'center', a = 1, wt = 400, maxW = 1500) => { if (a <= 0 || !s) return; ctx.save(); ctx.globalAlpha *= a; ctx.font = `${wt} ${px}px Georgia,serif`; const w = ctx.measureText(s).width; if (w > maxW) ctx.font = `${wt} ${px * maxW / w}px Georgia,serif`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.shadowColor = 'rgba(0,0,0,.85)'; ctx.shadowBlur = 8; ctx.fillStyle = col; ctx.fillText(s, x, y); ctx.restore(); };
const STARS = Array.from({ length: 260 }, (_, i) => [(i * 7919) % 1600, (i * 104729) % 1000, .4 + ((i * 31) % 10) / 12, (i * 17) % 7]);
const sky = now => { const g = ctx.createLinearGradient(0, 0, 0, 1000); g.addColorStop(0, '#05070f'); g.addColorStop(1, '#0f1830'); ctx.fillStyle = g; ctx.fillRect(-2000, -2000, 6000, 6000); STARS.forEach(([x, y, r, p]) => { ctx.globalAlpha = .3 + .45 * Math.abs(Math.sin(now * .0006 + p)); ctx.fillStyle = '#dfe7ff'; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }); ctx.globalAlpha = 1; };

// orthographic globe. view: centre latitude lat0, centre longitude lon0, radius R, centre (cx, cy)
const globe = (lat0, lon0, R, cx, cy) => { const c0 = Math.cos(lat0 * D), s0 = Math.sin(lat0 * D);
  const P = (lat, lon) => { const p = lat * D, l = (lon - lon0) * D, x = Math.cos(p) * Math.sin(l), y = Math.sin(p), z = Math.cos(p) * Math.cos(l), y2 = y * c0 - z * s0, z2 = y * s0 + z * c0; return { x: cx + R * x, y: cy - R * y2, z: z2 }; };
  const line = (pts, col, wd, dash) => { ctx.strokeStyle = col; ctx.lineWidth = wd; ctx.setLineDash(dash || []); ctx.beginPath(); let pen = false; for (const [la, lo] of pts) { const q = P(la, lo); if (q.z > 0) { pen ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y); pen = true; } else pen = false; } ctx.stroke(); ctx.setLineDash([]); };
  const meridian = (lo, col, wd, dash) => line(Array.from({ length: 91 }, (_, i) => [-90 + i * 2, lo]), col, wd, dash);
  const parallel = (la, col, wd, dash) => line(Array.from({ length: 181 }, (_, i) => [la, -180 + i * 2]), col, wd, dash);
  const body = () => { const g = ctx.createRadialGradient(cx - R * .35, cy - R * .35, R * .05, cx, cy, R); g.addColorStop(0, '#2f5a8c'); g.addColorStop(.7, '#15294a'); g.addColorStop(1, '#0b1526'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.fill();
    const a = ctx.createRadialGradient(cx, cy, R * .97, cx, cy, R * 1.08); a.addColorStop(0, 'rgba(111,179,255,.35)'); a.addColorStop(1, 'rgba(111,179,255,0)'); ctx.fillStyle = a; ctx.beginPath(); ctx.arc(cx, cy, R * 1.08, 0, 7); ctx.fill(); };
  const coast = (col = 'rgba(236,230,218,.7)', wd = 1.4) => { ctx.strokeStyle = col; ctx.lineWidth = wd; ctx.beginPath(); for (const ln of COAST.lines) { let pen = false; for (let i = 0; i < ln.length; i += 2) { const q = P(ln[i + 1] / COAST.q, ln[i] / COAST.q); if (q.z > 0) { pen ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y); pen = true; } else pen = false; } } ctx.stroke(); };
  const dot = (la, lo, col, r = 9) => { const q = P(la, lo); if (q.z <= 0) return null; ctx.fillStyle = col; ctx.beginPath(); ctx.arc(q.x, q.y, r, 0, 7); ctx.fill(); ctx.strokeStyle = '#0b1020'; ctx.lineWidth = 2.5; ctx.stroke(); return q; };
  return { P, line, meridian, parallel, body, coast, dot, R, cx, cy }; };

const CANDIDATES = [['Greenwich', 51.48, 0], ['Paris', 48.84, 2.34], ['Washington', 38.9, -77.04], ['Ferro', 27.75, -17.9]];
const card = (x, y, w, h, col, a = 1) => { ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = 'rgba(12,18,34,.92)'; ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.beginPath(); ctx.roundRect(x, y, w, h, 16); ctx.fill(); ctx.stroke(); ctx.restore(); };
const clockFace = (x, y, r, hrs, col, a = 1) => { ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = '#0d1424'; ctx.strokeStyle = col; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.stroke();
  for (let i = 0; i < 12; i++) { const t = i / 12 * 2 * Math.PI; ctx.strokeStyle = 'rgba(236,230,218,.6)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x + Math.sin(t) * r * .82, y - Math.cos(t) * r * .82); ctx.lineTo(x + Math.sin(t) * r * .95, y - Math.cos(t) * r * .95); ctx.stroke(); }
  const hA = (hrs % 12) / 12 * 2 * Math.PI, mA = (hrs % 1) * 2 * Math.PI; ctx.strokeStyle = W; ctx.lineCap = 'round'; ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.sin(hA) * r * .5, y - Math.cos(hA) * r * .5); ctx.stroke(); ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.sin(mA) * r * .75, y - Math.cos(mA) * r * .75); ctx.stroke(); ctx.restore(); };
const t12 = h => { h = ((h % 24) + 24) % 24; const hh = Math.floor(h), mm = Math.floor((h - hh) * 60); return `${hh % 12 || 12}:${String(mm).padStart(2, '0')} ${hh < 12 ? 'AM' : 'PM'}`; };

/* ============ A · Nature's Line, Our Line. One globe, side on, then spinning ============ */
const A = { steps: [
  ['Latitude Is Nature’s. Longitude Is Ours.', ''],
  ['The Spin Sets the Equator', 'Halfway between the two poles the Earth spins on.'],
  ['Latitude Is an Angle', 'Polaris stands 40° above your horizon: you are at 40° North.'],
  ['Every Meridian Looks the Same', 'Nothing in nature marks a zero for east and west.'],
  ['So Where Do We Put Zero?', 'Greenwich? Paris? Washington? The Canaries?'],
  ['1884: People Chose Greenwich', '25 nations voted, 22 to 1.'],
  ['Longitude Is Time', '360° in 24 hours: 15° every hour.']],
  draw(k, age, now) {
    sky(now);
    const spin = k === 0 || k === 6 ? now / 90 : 0, lon0 = k >= 4 ? 10 : -60 + (k === 0 ? spin : 0) + (k === 6 ? spin : 0);
    const g = globe(k === 2 ? 0 : 18, k === 6 ? -now / 60 : lon0, 260, 800, 530); g.body(); g.coast();
    // the axis and the poles
    if (k >= 1 && k <= 2) { const n = g.P(90, 0), s = g.P(-90, 0); ctx.strokeStyle = 'rgba(236,230,218,.7)'; ctx.lineWidth = 3; ctx.setLineDash([10, 8]); ctx.beginPath(); ctx.moveTo(n.x, n.y - 110); ctx.lineTo(s.x, s.y + 110); ctx.stroke(); ctx.setLineDash([]);
      text('North Pole', n.x + 20, n.y - 70, 34, W, 'left'); if (k === 1) text('South Pole', s.x + 20, s.y + 70, 34, W, 'left');
      if (k === 1) { ctx.save(); ctx.strokeStyle = G; ctx.lineWidth = 3; const r = 60, a0 = now / 300; ctx.beginPath(); ctx.ellipse(n.x, n.y - 80, r, 16, 0, a0, a0 + 5); ctx.stroke(); ctx.restore(); } }
    // the equator: nature's line
    if (k >= 1) { const a = k === 1 ? ease(age / 900) : 1; ctx.save(); ctx.globalAlpha = a; g.parallel(0, G, k <= 2 ? 6 : 3); ctx.restore(); const q = g.P(0, (k === 2 ? 0 : lon0) + 50); if (k === 1) text('Equator · 0°', 800 + 280, 530 + 40, 40, G, 'left', a, 600); }
    // latitude as an angle (side view, k = 2): radius to a person at 40°N on the left limb; horizon; Polaris straight up
    if (k === 2) { const L = 40, px = 800 - 260 * Math.cos(L * D), py = 530 - 260 * Math.sin(L * D), a = ease((age - 300) / 900);
      ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = W; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(800, 530); ctx.lineTo(px, py); ctx.moveTo(800, 530); ctx.lineTo(540, 530); ctx.stroke();
      ctx.strokeStyle = G; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(800, 530, 110, Math.PI, Math.PI + L * D); ctx.stroke(); ctx.restore(); text('40°', 655, 490, 46, G, 'center', a, 600);
      // the person, the horizon (tangent), and Polaris straight up (parallel to the axis)
      const tx = Math.sin(L * D), ty = Math.cos(L * D), b = ease((age - 1200) / 900); ctx.save(); ctx.globalAlpha = b;
      ctx.strokeStyle = '#6fd48a'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(px - tx * 170, py - ty * 170); ctx.lineTo(px + tx * 60, py + ty * 60); ctx.stroke();
      ctx.strokeStyle = B; ctx.lineWidth = 4; ctx.setLineDash([10, 8]); ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, py - 180); ctx.stroke(); ctx.setLineDash([]);
      const sg = ctx.createRadialGradient(px, py - 200, 0, px, py - 200, 30); sg.addColorStop(0, '#fff'); sg.addColorStop(.3, B); sg.addColorStop(1, 'rgba(111,179,255,0)'); ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(px, py - 200, 30, 0, 7); ctx.fill();
      ctx.strokeStyle = G; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(px, py, 90, -Math.PI / 2 - L * D, -Math.PI / 2); ctx.stroke(); // between the horizon and Polaris
      ctx.fillStyle = RED; ctx.beginPath(); ctx.arc(px, py, 11, 0, 7); ctx.fill(); ctx.restore();
      text('Polaris', px + 40, py - 200, 36, B, 'left', b); text('your horizon', px - tx * 180 - 10, py - ty * 180 + 30, 32, '#6fd48a', 'right', b); text('40°', px - 50, py - 125, 46, G, 'right', b, 600); }
    // meridians, all the same
    if (k >= 3) { const a = k === 3 ? ease(age / 1200) : 1; ctx.save(); ctx.globalAlpha = a; for (let lo = -180; lo < 180; lo += 15) g.meridian(lo, 'rgba(236,230,218,.45)', 2); ctx.restore(); }
    // candidates for zero
    if (k === 4 || k === 5) CANDIDATES.forEach(([n, la, lo], i) => { const on = k === 4 ? Math.floor(age / 900) % 4 === i : n === 'Greenwich'; if (k === 5 && !on) return; if (on) g.meridian(lo, G, 6); const q = g.dot(la, lo, on ? G : W, on ? 12 : 9); if (q) { const [dx, dy, al] = [[-20, -26, 'right'], [22, 30, 'left'], [-20, -26, 'right'], [-20, 30, 'right']][i]; text(n, q.x + dx, q.y + dy, 34, on ? G : W, al, 1, on ? 600 : 400); } });
    // longitude is time: a 24-hour ring around the turning globe
    if (k === 6) { const a = ease(age / 900); ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = 'rgba(240,179,90,.6)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(800, 530, 320, 0, 7); ctx.stroke(); ctx.restore();
      for (let h = 0; h < 24; h++) { const t = h / 24 * 2 * Math.PI - Math.PI / 2; ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = G; ctx.lineWidth = h % 6 ? 2 : 5; ctx.beginPath(); ctx.moveTo(800 + Math.cos(t) * 310, 530 + Math.sin(t) * 310); ctx.lineTo(800 + Math.cos(t) * 330, 530 + Math.sin(t) * 330); ctx.stroke(); ctx.restore(); if (h % 6 === 0) text(`${h} h`, 800 + Math.cos(t) * 365, 530 + Math.sin(t) * 365, 34, G, 'center', a); }
      card(1240, 430, 300, 200, G, ease((age - 900) / 700)); text('15°', 1390, 500, 84, G, 'center', ease((age - 900) / 700), 600); text('= 1 hour', 1390, 580, 40, W, 'center', ease((age - 900) / 700)); }
  } };

/* ============ B · The Earth Is a Clock. Looking down on the North Pole ============ */
const B2 = { steps: [
  ['Look Down on the North Pole', 'The Sun is on the right. Its side of the Earth is day.'],
  ['One Turn = 24 Hours', 'The Earth is a clock face.'],
  ['360° ÷ 24 Hours = 15° per Hour', 'Every hour of turning is 15° of longitude.'],
  ['Two Clocks, One Longitude', 'London is 5 hours ahead of New York: 5 × 15° = 75°.'],
  ['But Which Clock Is Zero?', 'Any line could be hour zero.'],
  ['1884: Greenwich Is Hour Zero', 'A vote, not a law of nature.'],
  ['The Hard Part: Carry Home Time to Sea', 'Your own noon is easy. Greenwich time, 3,000 miles out, is not.']],
  draw(k, age, now) {
    sky(now);
    const turn = k === 1 || k === 3 ? now / 70 : k >= 4 ? 0 : 20, lon0 = 60 - turn; // the Earth turns counterclockwise, west to east
    const cx = 700, cy = 530, R = 255, g = globe(90, k >= 4 ? -80 : lon0, R, cx, cy);
    // the Sun and its rays on the right
    const sx = 1450, sunA = k === 3 || k === 6 ? .25 : 1; ctx.globalAlpha = sunA; const sg = ctx.createRadialGradient(sx, cy, 0, sx, cy, 110); sg.addColorStop(0, '#fff3c4'); sg.addColorStop(.45, G); sg.addColorStop(1, 'rgba(240,179,90,0)'); ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(sx, cy, 110, 0, 7); ctx.fill();
    ctx.save(); ctx.strokeStyle = 'rgba(240,179,90,.3)'; ctx.lineWidth = 2; ctx.setLineDash([16, 12]); ctx.lineDashOffset = now / 25; for (let i = -3; i <= 3; i++) { ctx.beginPath(); ctx.moveTo(sx - 120, cy + i * 95); ctx.lineTo(cx + R + 20, cy + i * 95); ctx.stroke(); } ctx.restore(); text('Sun', sx, cy + 150, 36, G, 'center', sunA); ctx.globalAlpha = 1;
    g.body(); g.coast(); for (let lo = -180; lo < 180; lo += 15) g.meridian(lo, k === 2 ? 'rgba(240,179,90,.45)' : 'rgba(236,230,218,.14)', k === 2 ? 2 : 1);
    // night half
    ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, R, Math.PI / 2, Math.PI * 1.5); ctx.closePath(); ctx.fillStyle = 'rgba(2,4,10,.55)'; ctx.fill(); ctx.restore();
    // the fixed 24-hour dial: noon facing the Sun
    if (k >= 1) { const a = k === 1 ? ease(age / 900) : 1; ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = 'rgba(240,179,90,.55)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(cx, cy, R + 50, 0, 7); ctx.stroke(); ctx.restore();
      for (let h = 0; h < 24; h++) { const t = (h - 12) / 24 * 2 * Math.PI; const x1 = cx + Math.cos(t) * (R + 40), y1 = cy - Math.sin(t) * (R + 40); ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = G; ctx.lineWidth = h % 6 ? 2 : 5; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(cx + Math.cos(t) * (R + 60), cy - Math.sin(t) * (R + 60)); ctx.stroke(); ctx.restore(); }
      [['Noon', 0], ['6 PM', 1], ['Midnight', 2], ['6 AM', 3]].forEach(([s, i]) => { const t = i * Math.PI / 2; text(s, cx + Math.cos(t) * (R + (i % 2 ? 0 : 130)), cy - Math.sin(t) * (R + 95), 34, i === 0 ? G : W, 'center', a); }); }
    // 15° wedge
    if (k === 2) { const a = ease(age / 900), t0 = -7.5 * D; ctx.save(); ctx.globalAlpha = a * .5; ctx.fillStyle = G; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R, t0 - 15 * D / 2 + 7.5 * D - 7.5 * D, t0 + 15 * D); ctx.closePath(); ctx.fill(); ctx.restore(); text('15° = 1 hour', cx + R + 90, cy - 150, 46, G, 'left', a, 600); }
    // two cities and their clocks
    const noonLon = (k >= 4 ? -80 : lon0) + 90, localH = lo => 12 + (lo - noonLon) / 15;
    if (k === 3) { [['London', 51.5, -0.1, G, 1230, 180], ['New York', 40.7, -74, B, 1230, 650]].forEach(([n, la, lo, col, x, y]) => { const q = g.dot(la, lo, col, 11); if (q) text(n, q.x - 18, q.y - 26, 32, col, 'right', 1, 600); card(x, y, 330, 170, col); clockFace(x + 75, y + 85, 55, localH(lo), col); text(n, x + 150, y + 55, 30, col, 'left'); text(t12(localH(lo)), x + 150, y + 112, 40, W, 'left', 1, 600); });
      text('5 h × 15° = 75°', 1395, 530, 44, G, 'center', ease((age - 1200) / 700), 600); }
    // which clock is zero?
    if (k === 4 || k === 5) CANDIDATES.forEach(([n, la, lo], i) => { const on = k === 4 ? Math.floor(age / 900) % 4 === i : n === 'Greenwich'; if (k === 5 && !on) return; if (on) g.meridian(lo, G, 6); const q = g.dot(la, lo, on ? G : W, on ? 12 : 9); if (q) { const [dx, dy, al] = [[-20, -26, 'right'], [22, 30, 'left'], [-20, -26, 'right'], [-20, 30, 'right']][i]; text(on ? `${n} = 0 h` : n, q.x + dx, q.y + dy, 34, on ? G : W, al, 1, on ? 600 : 400); } });
    // the hard part
    if (k === 6) { const a = ease(age / 800); card(1180, 170, 380, 190, B, a); clockFace(1260, 265, 60, 12, B, a); text('Ship', 1345, 235, 32, B, 'left', a); text('12:00', 1345, 295, 46, W, 'left', a, 600);
      card(1180, 600, 380, 190, G, ease((age - 700) / 700)); text('Greenwich', 1210, 655, 32, G, 'left', ease((age - 700) / 700)); text('?', 1370, 730, 90, W, 'center', ease((age - 700) / 700), 600); }
  } };

/* ============ C · Two Questions, 2,000 Years Apart. Side by side, then a timeline ============ */
const C3 = { steps: [
  ['Two Questions', 'How far north? How far east?'],
  ['The Zero Line', ''],
  ['How You Measure It', ''],
  ['The Numbers', ''],
  ['How Long It Took', ''],
  ['Latitude: Ancient. Longitude at Sea: the 1760s.', 'Two thousand years apart.']],
  draw(k, age, now) {
    sky(now);
    if (k <= 3) {
      // headers
      text('Latitude', 420, 200, 64, G, 'center', 1, 600); text('Longitude', 1180, 200, 64, B, 'center', 1, 600);
      text('north–south', 420, 255, 32, M); text('east–west', 1180, 255, 32, M);
      ctx.strokeStyle = 'rgba(236,230,218,.2)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(800, 170); ctx.lineTo(800, 900); ctx.stroke();
      const row = (i, l1, l2, r1, r2, icoL, icoR) => { const y = 340 + i * 190, a = k === i + 1 ? ease(age / 700) : k > i + 1 ? 1 : 0; if (a <= 0) return;
        ctx.save(); ctx.globalAlpha = a; icoL(250, y + 40); icoR(1010, y + 40); ctx.restore();
        text(l1, 330, y + 15, 46, W, 'left', a, 600); text(l2, 330, y + 70, 32, M, 'left', a); text(r1, 1090, y + 15, 46, W, 'left', a, 600); text(r2, 1090, y + 70, 32, M, 'left', a); };
      // icons
      const eqIcon = (x, y) => { ctx.fillStyle = '#1d3354'; ctx.beginPath(); ctx.arc(x, y, 50, 0, 7); ctx.fill(); ctx.strokeStyle = G; ctx.lineWidth = 6; ctx.beginPath(); ctx.ellipse(x, y, 50, 12, 0, 0, 7); ctx.stroke(); };
      const voteIcon = (x, y) => { ctx.fillStyle = '#1d3354'; ctx.beginPath(); ctx.arc(x, y, 50, 0, 7); ctx.fill(); ctx.strokeStyle = B; ctx.lineWidth = 6; ctx.beginPath(); ctx.ellipse(x, y, 12, 50, 0, 0, 7); ctx.stroke(); text('?', x + 32, y - 34, 40, B, 'center', 1, 600); };
      const angIcon = (x, y) => { ctx.strokeStyle = W; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(x - 50, y + 35); ctx.lineTo(x + 50, y + 35); ctx.moveTo(x - 50, y + 35); ctx.lineTo(x + 30, y - 35); ctx.stroke(); ctx.strokeStyle = G; ctx.beginPath(); ctx.arc(x - 50, y + 35, 45, -41 * D, 0); ctx.stroke(); };
      const clkIcon = (x, y) => { clockFace(x - 22, y, 32, 12, B); clockFace(x + 42, y, 32, 7, B); };
      const numL = (x, y) => text('0–90°', x, y, 38, G, 'center', 1, 600), numR = (x, y) => text('15°/h', x, y, 38, B, 'center', 1, 600);
      row(0, 'The Equator', 'set by the spin: nature', 'Greenwich', 'chosen by a vote in 1884', eqIcon, voteIcon);
      row(1, 'An Angle', 'how high Polaris stands', 'A Time Difference', 'your noon against home noon', angIcon, clkIcon);
      row(2, '0° to 90°', 'equator to pole', '360° = 24 Hours', '15° for every hour', numL, numR);
      if (k === 0) text('Same globe. Two very different problems.', 800, 600, 46, W, 'center', ease(age / 900));
    } else {
      // timeline: latitude solid from antiquity; longitude unknown at sea until the 1760s
      const X = yr => yr < 1550 ? 160 + (yr + 400) / 1950 * 200 : 400 + (yr - 1550) / 470 * 1120; // a break before 1550
      const reveal = k === 4 ? clamp(age / 3200) : 1, xr = lerp(160, 1530, reveal);
      ctx.save(); ctx.beginPath(); ctx.rect(0, 0, xr, 1000); ctx.clip();
      // axis
      ctx.strokeStyle = 'rgba(236,230,218,.35)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(160, 840); ctx.lineTo(1530, 840); ctx.stroke();
      ctx.fillStyle = '#0f1830'; ctx.fillRect(367, 825, 26, 30); text('≈', 380, 840, 34, M);
      [[-325, '325 BC'], [1600, '1600'], [1700, '1700'], [1800, '1800'], [1900, '1900'], [2000, '2000']].forEach(([y, s]) => { text(s, X(y), 882, 30, M); });
      // latitude lane
      ctx.strokeStyle = G; ctx.lineWidth = 16; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(X(-325), 250); ctx.lineTo(X(2000), 250); ctx.stroke();
      text('Latitude', 160, 195, 50, G, 'left', 1, 600); text('a stick and a star, ever since', X(-325), 300, 32, W, 'left');
      // longitude lane: dashed while unsolved at sea, solid after
      ctx.strokeStyle = 'rgba(111,179,255,.45)'; ctx.lineWidth = 10; ctx.setLineDash([18, 14]); ctx.beginPath(); ctx.moveTo(X(-325), 660); ctx.lineTo(X(1761), 660); ctx.stroke(); ctx.setLineDash([]);
      ctx.strokeStyle = B; ctx.lineWidth = 16; ctx.beginPath(); ctx.moveTo(X(1761), 660); ctx.lineTo(X(2000), 660); ctx.stroke(); ctx.lineCap = 'butt';
      text('Longitude at Sea', 160, 400, 50, B, 'left', 1, 600); text('a guess', X(-325), 710, 32, M, 'left');
      const EV = [[1610, 'Galileo’s moons', 0], [1668, 'works on land', 1], [1707, 'Scilly', 2], [1714, '£20,000 prize', 3], [1761, 'clock at sea', 0], [1884, 'zero chosen', 1], [1995, 'GPS', 0]];
      EV.forEach(([y, s, lv]) => { const x = X(y), yy = 610 - lv * 52; ctx.fillStyle = y === 1761 || y === 1995 ? B : W; ctx.beginPath(); ctx.arc(x, 660, 10, 0, 7); ctx.fill(); ctx.strokeStyle = 'rgba(236,230,218,.35)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x, 650); ctx.lineTo(x, yy + 16); ctx.stroke(); text(`${y} ${s}`, x, yy, 30, y === 1707 ? RED : W, 'center', 1, y === 1761 ? 600 : 400); });
      ctx.restore();
    }
    if (k === 5) { card(380, 720, 840, 100, G, ease(age / 700)); text('≈ 2,000 years between them', 800, 770, 48, G, 'center', ease(age / 700), 600); }
  } };

/* ---------- player ---------- */
const VS = { a: A, b: B2, c: C3 }, NAMES = { a: 'A · Nature’s Line, Our Line', b: 'B · The Earth Is a Clock', c: 'C · Two Questions, 2,000 Years Apart' };
let v = (new URLSearchParams(location.search).get('v') || 'a').toLowerCase(); if (!VS[v]) v = 'a';
document.querySelectorAll('#bar a').forEach(a => a.classList.toggle('on', a.dataset.v === v));
let step = 0, t0 = performance.now();
const go = d => { const n = VS[v].steps.length, s = Math.max(0, Math.min(n - 1, step + d)); if (s !== step) { step = s; t0 = performance.now(); } };
addEventListener('keydown', e => { if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); go(1); } else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); go(-1); } else if ('abc'.includes(e.key.toLowerCase()) && e.key.length === 1) location.search = '?v=' + e.key.toLowerCase(); });
document.getElementById('next').onclick = () => go(1); document.getElementById('prev').onclick = () => go(-1);
cv.addEventListener('click', e => go(e.clientX > innerWidth * .3 ? 1 : -1));
const frame = now => { requestAnimationFrame(frame); const V = VS[v], age = now - t0; ctx.save(); V.draw(step, age, now); ctx.restore();
  const [h, c] = V.steps[step], a = ease(age / 600); text(h, 800, 80, 64, W, 'center', a); text(c, 800, 945, 38, G, 'center', a);
  document.getElementById('pos').textContent = `${step + 1} / ${V.steps.length}`; };
requestAnimationFrame(frame);
</script>
