<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Where Am I? · GIS Day 2026</title>
<meta name="description" content="A 30-minute GIS Day deck. Where am I? Measurement, latitude, and the race for longitude.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✦</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#161514;overflow:hidden}
canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fffdf6;touch-action:none;cursor:pointer}
#hint{position:fixed;left:0;right:0;bottom:0;padding:.45rem 1rem;font:16px Georgia,serif;color:#cfc9bd;display:flex;justify-content:space-between;opacity:0;transition:opacity .3s;pointer-events:none}
body:hover #hint{opacity:.9}
#notes{position:fixed;top:24px;right:24px;width:min(460px,36vw);max-height:calc(100% - 48px);overflow:auto;background:#fffdf6;color:#161514;border:1px solid #cdc8bc;padding:22px 24px 18px;font:21px/1.4 "Source Serif 4",Georgia,serif;z-index:4;box-sizing:border-box}
#notes[hidden]{display:none}
#notes .by{margin:0 0 4px;color:#b01f24;font-size:28px;font-weight:500}
#notes .dur{margin:0 0 12px;color:#6b6763;font-size:18px}
#notes h2{margin:0 0 12px;font-size:28px;font-weight:500;line-height:1.15}
#notes ul{margin:0;padding-left:1.15em}
#notes li{margin:0 0 10px}
#notes .ask{margin:0 0 12px;font-style:italic}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<aside id="notes" hidden></aside>
<div id="hint"><span>Click, space, or arrows · N notes · F full screen</span><span id="hint-by"></span></div>
<script src="../claude1/coast.js"></script>
<script src="deck.js"></script>
</body>
</html>
