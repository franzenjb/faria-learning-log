<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Where Am I? · GIS Day 2026</title>
<meta name="description" content="A 30-minute GIS Day deck. Where am I? Measurement, latitude, and the race for longitude.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✦</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#161514;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fffdf6;touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;z-index:1}
#gl{background:transparent !important;z-index:2;pointer-events:none;visibility:hidden}
#beat{position:fixed;z-index:3;left:0;right:0;bottom:92px;margin:0;text-align:center;font:46px/1.2 "Source Serif 4",Georgia,serif;color:#161514;pointer-events:none;text-shadow:0 0 14px #fffdf6,0 0 4px #fffdf6}
#beat[hidden]{display:none}
.navbtn{position:fixed;z-index:8;min-width:48px;min-height:48px;padding:0 18px;border:1px solid #cdc8bc;background:rgba(255,253,246,.94);color:#161514;font:22px/1 "Source Serif 4",Georgia,serif;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#nav-prev{left:16px;bottom:16px}
#nav-next{right:16px;bottom:16px}
#nav-menu{left:50%;bottom:16px;transform:translateX(-50%)}
#layers{position:fixed;z-index:8;top:14px;right:10px;display:flex;flex-direction:column;gap:8px}
#layers[hidden]{display:none}
#layers .navbtn{position:static;min-width:0;min-height:44px;padding:6px 10px;font-size:16px}
#layers button.on{color:#b01f24;border-color:#b01f24}
body.night .navbtn{background:rgba(8,12,22,.9);color:#f4efe4;border-color:#8a8174}
body.night #hint{color:#d9d2c6}
#menu-back{position:fixed;inset:0;z-index:9;background:transparent}
#menu-back[hidden],#menu[hidden]{display:none}
#menu{position:fixed;z-index:10;top:0;left:0;bottom:0;width:min(440px,90vw);margin:0;overflow:auto;background:#fffdf6;color:#161514;border-right:1px solid #cdc8bc;font:22px/1.3 "Source Serif 4",Georgia,serif}
#menu header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #cdc8bc}
#menu header p{margin:0;font-size:22px}
#menu-close{min-width:48px;min-height:48px;border:0;background:transparent;color:#161514;font:32px/1 Georgia,serif;cursor:pointer;touch-action:manipulation}
#menu button.item{display:block;width:100%;min-height:48px;margin:0;padding:12px 18px;border:0;border-bottom:1px solid #cdc8bc;background:transparent;color:#161514;font:inherit;text-align:left;cursor:pointer;touch-action:manipulation}
#menu button.item.on{color:#b01f24}
#menu button.home{font-weight:500}
#menu p.appendix,#menu p.act{margin:0;padding:16px 18px 4px;color:#6b6763;font-size:18px}
#hint{position:fixed;left:0;right:0;bottom:0;padding:.45rem 1rem;font:16px Georgia,serif;color:#cfc9bd;display:flex;justify-content:space-between;opacity:0;transition:opacity .3s;pointer-events:none}
#hint[hidden]{display:none}
body:hover #hint{opacity:.9}
#notes{position:fixed;top:24px;right:24px;width:min(460px,36vw);max-height:calc(100% - 48px);overflow:auto;background:#fffdf6;color:#161514;border:1px solid #cdc8bc;padding:22px 24px 18px;font:21px/1.4 "Source Serif 4",Georgia,serif;z-index:4;box-sizing:border-box}
#notes[hidden]{display:none}
#notes .by{margin:0 0 4px;color:#b01f24;font-size:28px;font-weight:500}
#notes .dur{margin:0 0 12px;color:#6b6763;font-size:18px}
#notes h2{margin:0 0 12px;font-size:28px;font-weight:500;line-height:1.15}
#notes ul{margin:0;padding-left:1.15em}
#notes li{margin:0 0 10px}
#notes .ask{margin:0 0 12px;font-style:italic}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<canvas id="gl"></canvas>
<p id="beat" hidden></p>
<button type="button" class="navbtn" id="nav-prev">‹ Back</button>
<button type="button" class="navbtn" id="nav-menu">≡ Slides</button>
<button type="button" class="navbtn" id="nav-next">Next ›</button>
<div id="layers" hidden>
  <button type="button" class="navbtn" id="tog-lat">Latitude</button>
  <button type="button" class="navbtn" id="tog-lon">Longitude</button>
  <button type="button" class="navbtn" id="tog-bingo">Bingo</button>
</div>
<div id="menu-back" hidden></div>
<nav id="menu" hidden aria-label="Slides"><header><p>Slides</p><button type="button" id="menu-close" aria-label="Close">×</button></header><div id="menu-list"></div></nav>
<aside id="notes" hidden></aside>
<div id="hint"><span>Click, space, or arrows · N notes · F full screen</span><span id="hint-by"></span></div>
<script src="vendor/three.min.js"></script>
<script src="globe3d.js"></script>
<script src="../claude1/coast.js"></script>
<script src="deck.js"></script>
</body>
</html>
