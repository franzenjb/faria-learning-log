<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 790" role="img" aria-labelledby="title desc">
  <title id="title">Kepler orbit ratios</title>
  <desc id="desc">Orbits of Mercury, Venus, Earth, and Mars drawn to scale. A bracket marks the simplified 0.277 AU gap between Venus and Earth at inferior conjunction. An ellipse with exaggerated eccentricity shows the semimajor axis beside a single day's distance. A table lists semimajor axes from the two-thirds power of the orbital periods.</desc>
  <rect width="1000" height="790" fill="#fbf8f2"/>
  <style>
    text { font-family: "Palatino Linotype", Palatino, "Liberation Serif", Georgia, serif; fill: #1c1915; }
    .m { fill: #5e584e; }
    .a { fill: #8c3f1e; }
  </style>
  <text x="32" y="38" font-size="26">Kepler's third law: periods fix relative distances</text>
  <text x="32" y="66" class="m" font-size="17">a&#179; / T&#178; is the same number for every planet. a is the semimajor axis. T is the period.</text>

  <!-- center (300,470); 1 AU = 120 px -->
  <g fill="none">
    <circle cx="300" cy="470" r="183" stroke="#8a8175" stroke-width="1.5"/>
    <circle cx="300" cy="470" r="120" stroke="#8c3f1e" stroke-width="2"/>
    <circle cx="300" cy="470" r="86.8" stroke="#8a8175" stroke-width="1.5"/>
    <circle cx="300" cy="470" r="46.4" stroke="#8a8175" stroke-width="1.5"/>
  </g>
  <circle cx="300" cy="470" r="7" fill="#8c3f1e"/>
  <text x="312" y="492" class="a" font-size="15">Sun</text>

  <line x1="300" y1="470" x2="300" y2="276" stroke="#d9d0c2" stroke-width="1"/>
  <g font-size="16">
    <line x1="292" y1="287" x2="308" y2="287" stroke="#1c1915" stroke-width="1.2"/>
    <text x="28" y="292">Mars</text>
    <text x="78" y="292" class="m">1.52 AU</text>

    <line x1="292" y1="350" x2="308" y2="350" stroke="#8c3f1e" stroke-width="1.4"/>
    <text x="28" y="355" class="a">Earth</text>
    <text x="84" y="355" class="a">1 AU</text>

    <line x1="292" y1="383" x2="308" y2="383" stroke="#1c1915" stroke-width="1.2"/>
    <text x="28" y="388">Venus</text>
    <text x="84" y="388" class="m">0.723 AU</text>

    <line x1="292" y1="424" x2="308" y2="424" stroke="#1c1915" stroke-width="1.2"/>
    <text x="28" y="429">Mercury</text>
    <text x="108" y="429" class="m">0.387</text>
  </g>

  <line x1="300" y1="470" x2="496" y2="470" stroke="#d9d0c2" stroke-width="1"/>
  <circle cx="346.4" cy="470" r="3.4" fill="#1c1915"/>
  <circle cx="386.8" cy="470" r="4" fill="#1c1915"/>
  <circle cx="420" cy="470" r="4.5" fill="#8c3f1e"/>
  <circle cx="483" cy="470" r="3.4" fill="#1c1915"/>
  <line x1="386.8" y1="488" x2="386.8" y2="498" stroke="#8c3f1e" stroke-width="1.3"/>
  <line x1="420" y1="488" x2="420" y2="498" stroke="#8c3f1e" stroke-width="1.3"/>
  <line x1="386.8" y1="498" x2="420" y2="498" stroke="#8c3f1e" stroke-width="1.3"/>
  <text x="368" y="446" class="a" font-size="13">0.277</text>
  <text x="28" y="710" class="m" font-size="15">Dots: planets on the near side. The bracket is the 0.277 AU gap, Earth minus Venus, in the circular model.</text>
  <text x="28" y="732" class="m" font-size="15">Jupiter (5.2 AU) and Saturn (9.5 AU) would fall off the page.</text>

  <text x="540" y="112" font-size="20">a is not today's distance</text>
  <text x="540" y="136" class="m" font-size="15">Eccentricity exaggerated so the focus is obvious.</text>
  <ellipse cx="750" cy="220" rx="120" ry="54" fill="none" stroke="#6f675c" stroke-width="1.6"/>
  <line x1="630" y1="220" x2="870" y2="220" stroke="#d9d0c2" stroke-width="1"/>
  <circle cx="750" cy="220" r="2.4" fill="#1c1915"/>
  <circle cx="794" cy="220" r="6" fill="#8c3f1e"/>
  <text x="804" y="214" class="a" font-size="14">Sun</text>
  <line x1="750" y1="236" x2="870" y2="236" stroke="#8c3f1e" stroke-width="1.3"/>
  <line x1="750" y1="230" x2="750" y2="242" stroke="#8c3f1e" stroke-width="1.3"/>
  <line x1="870" y1="230" x2="870" y2="242" stroke="#8c3f1e" stroke-width="1.3"/>
  <text x="800" y="256" class="a" font-size="16">a</text>
  <text x="852" y="208" font-size="14">closest</text>
  <text x="600" y="208" font-size="14">farthest</text>
  <circle cx="690" cy="176" r="3.6" fill="#1c1915"/>
  <line x1="794" y1="220" x2="690" y2="176" stroke="#1c1915" stroke-width="1.1"/>
  <text x="600" y="168" font-size="14">distance on a given day</text>
  <text x="540" y="300" class="m" font-size="15">a is half the long axis: the average of</text>
  <text x="540" y="320" class="m" font-size="15">closest and farthest. The line drawn</text>
  <text x="540" y="340" class="m" font-size="15">to one day has a different length.</text>

  <text x="540" y="392" font-size="20">From the clock: a = T^(2/3)</text>
  <line x1="540" y1="408" x2="968" y2="408" stroke="#1c1915" stroke-width="1.1"/>
  <text x="540" y="432" class="m" font-size="15">Planet</text>
  <text x="710" y="432" class="m" font-size="15">Period T</text>
  <text x="880" y="432" class="m" font-size="15">a, in AU</text>
  <line x1="540" y1="442" x2="968" y2="442" stroke="#d9d0c2" stroke-width="1"/>
  <g font-size="17">
    <text x="540" y="468">Mercury</text><text x="710" y="468">0.241 year</text><text x="880" y="468">0.387</text>
    <text x="540" y="496">Venus</text><text x="710" y="496">0.615 year</text><text x="880" y="496" class="a">0.723</text>
    <text x="540" y="524" class="a">Earth</text><text x="710" y="524" class="a">1 year</text><text x="880" y="524" class="a">1</text>
    <text x="540" y="552">Mars</text><text x="710" y="552">1.881 years</text><text x="880" y="552">1.524</text>
    <text x="540" y="580">Jupiter</text><text x="710" y="580">11.86 years</text><text x="880" y="580">5.20</text>
    <text x="540" y="608">Saturn</text><text x="710" y="608">29.46 years</text><text x="880" y="608">9.54</text>
  </g>
  <text x="540" y="648" class="m" font-size="14">Rounded sidereal periods, Earth set to 1. Modern semimajor</text>
  <text x="540" y="668" class="m" font-size="14">axes agree here. Venus shifts a&#179;/T&#178; by parts per million.</text>
  <text x="540" y="688" class="m" font-size="14">Jupiter shifts it by about 0.1 percent. Not one rule for all.</text>
</svg>
