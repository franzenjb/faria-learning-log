<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Why a solar day is four minutes longer than a star day</title>
  <desc id="desc">After one full turn of the Earth, a noon mark points at a distant star. A rust arc shows the extra turn, about 1° in reality, still needed to face the Sun. The orbital step is drawn large on purpose: 20° here, 1° in the sky.</desc>
  <rect width="960" height="520" fill="#fcfbf7"/>
  <g font-family="DejaVu Sans, Liberation Sans, Noto Sans, sans-serif" fill="#26363b">
    <text x="24" y="26" font-size="14" font-weight="700">Why a solar day is four minutes longer than a star day</text>
    <text x="24" y="46" font-size="11" fill="#637177">The orbital step is drawn large on purpose. In a real day it is only about 1°.</text>
    <g stroke="#637177" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="3 6" fill="none">
      <line x1="115.2" y1="58" x2="115.2" y2="78"/><line x1="182.4" y1="58" x2="182.4" y2="78"/><line x1="249.6" y1="58" x2="249.6" y2="78"/><line x1="316.8" y1="58" x2="316.8" y2="78"/><line x1="384.0" y1="58" x2="384.0" y2="78"/><line x1="451.2" y1="58" x2="451.2" y2="78"/><line x1="518.4" y1="58" x2="518.4" y2="78"/><line x1="585.6" y1="58" x2="585.6" y2="78"/><line x1="652.8" y1="58" x2="652.8" y2="78"/><line x1="720.0" y1="58" x2="720.0" y2="78"/>
    </g>
    <g stroke="#26363b" stroke-width="1.1" fill="none">
      <line x1="844.8" y1="57" x2="844.8" y2="71"/>
      <line x1="837.8" y1="64" x2="851.8" y2="64"/>
      <line x1="839.8" y1="59" x2="849.8" y2="69"/>
      <line x1="839.8" y1="69" x2="849.8" y2="59"/>
    </g>
    <text x="830.8" y="82" font-size="11" fill="#637177" text-anchor="end">distant star  ·  same direction everywhere</text>
    <circle cx="441.6" cy="260.0" r="166.4" fill="none" stroke="#b8c0c0" stroke-width="1.2"/>
    <circle cx="441.6" cy="260.0" r="31.4" fill="#f3dd9a" fill-opacity="0.35"/>
    <circle cx="441.6" cy="260.0" r="15.0" fill="#e6c46e" stroke="#26363b" stroke-width="1"/>
    <text x="441.6" y="291.0" font-size="11" text-anchor="middle">Sun</text>
    <circle cx="384.7" cy="416.4" r="23.3" fill="#eef1f1" stroke="#26363b" stroke-width="1.4"/>
    <text x="384.7" y="455.7" font-size="11" text-anchor="middle">Earth</text>
    <circle cx="384.7" cy="393.1" r="4" fill="#26363b"/>
    <line x1="384.7" y1="393.1" x2="384.7" y2="361.6" stroke="#26363b" stroke-width="1.8" stroke-linecap="round"/>
    <polygon points="384.7,361.6 387.4,368.1 382.0,368.1" fill="#26363b"/>
    <text x="353.4" y="397.1" font-size="11" text-anchor="end">noon</text>
    <line x1="384.7" y1="416.4" x2="403.4" y2="364.9" stroke="#a95039" stroke-opacity="0.7" stroke-width="1.4" stroke-dasharray="4 5"/>
    <path d="M 384.7 361.6 A 54.7 54.7 0 0 1 403.4 364.9" fill="none" stroke="#a95039" stroke-width="2.4"/>
    <text x="491.8" y="361.1" font-size="12" fill="#a95039" text-anchor="start" font-weight="700">extra turn to face the Sun</text>
    <text x="491.8" y="379.1" font-size="11" fill="#a95039" text-anchor="start">20° here, 1° in reality  ≈  4 min</text>
    <text x="480" y="488" font-size="12" text-anchor="middle">1 full turn of the Earth  ·  star back overhead  ·  Sun not yet</text>
    <text x="480" y="506" font-size="11" fill="#637177" text-anchor="middle">Orbit exaggerated: one day moves Earth 20° here, 1° in reality  ·  sidereal day 23 h 56 m  ·  solar day 24 h</text>
  </g>
</svg>
