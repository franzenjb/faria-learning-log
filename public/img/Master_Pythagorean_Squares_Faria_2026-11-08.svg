<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="332" viewBox="0 0 480 332" role="img" aria-labelledby="t d">
<title id="t">Squares on 3-4-5</title><desc id="d">Squares on the sides of a 3-4-5 right triangle, marked 9, 16, and 25 square feet.</desc>
<rect width="480" height="332" fill="#fbf8f2"/>
<style>text { font-family: Georgia, 'Iowan Old Style', Palatino, 'Palatino Linotype', serif; fill: #22201c; }</style>
<text x="16" y="26" font-size="20" fill="#22201c" text-anchor="start">Squares on a 3-4-5 triangle</text>
<path d="M160 190 L160 124 L248 190 Z" fill="none" stroke="#22201c" stroke-width="1.8"/>
<path d="M160 190 L160 124 L94 124 L94 190 Z" fill="#e4d5c4" stroke="#7a4b1e" stroke-width="1.4"/>
<text x="118" y="162" font-size="16" fill="#7a4b1e" text-anchor="middle">9</text>
<path d="M160 190 L248 190 L248 278 L160 278 Z" fill="#c4a484" stroke="#7a4b1e" stroke-width="1.4"/>
<text x="204" y="238" font-size="16" fill="#7a4b1e" text-anchor="middle">16</text>
<path d="M160 124 L248 190 L314 102 L226 36 Z" fill="#f3e6d4" stroke="#7a4b1e" stroke-width="1.4"/>
<text x="236" y="112" font-size="16" fill="#7a4b1e" text-anchor="middle">25</text>
<text x="16" y="310" font-size="15" fill="#6b645a" text-anchor="start">9 + 16 = 25. The long side is 5.</text></svg>