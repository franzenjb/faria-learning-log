<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" role="img">
  <title>Four vessels, four jobs</title>
  <desc>Endeavour, a former collier, carried Cook's first voyage. Seahorse carried Mason and Dixon in 1761 and was attacked. Bounty was fitted as a breadfruit nursery under Bligh. Her launch, about 23 feet, carried the castaways to Timor. These are roles, not a scale drawing of the hulls.</desc>
  <rect width="920" height="280" fill="#fbf8f2"/>
  <style>text{font-family:"Palatino Linotype",Palatino,"Liberation Serif",Georgia,serif;fill:#1c1915}.m{fill:#5e584e}.a{fill:#8c3f1e}</style>
  <text x="24" y="32" font-size="20">The hull is the job</text>
  <text x="24" y="54" class="m" font-size="14">Not to scale. Names and duties only.</text>
  <line x1="24" y1="70" x2="890" y2="70" stroke="#1c1915" stroke-width="1"/>
  <g font-size="15">
    <text x="24" y="98" class="a">Endeavour</text>
    <text x="24" y="122" class="m">ex Earl of Pembroke</text>
    <text x="24" y="146">Cook, 1768-1771</text>
    <text x="24" y="170" class="m">stores and a survey</text>
    <text x="250" y="98" class="a">Seahorse</text>
    <text x="250" y="122" class="m">naval escort, 1761</text>
    <text x="250" y="146">Mason and Dixon</text>
    <text x="250" y="170" class="m">fought, then the Cape</text>
    <text x="480" y="98" class="a">Bounty</text>
    <text x="480" y="122" class="m">ex Bethia, 1787</text>
    <text x="480" y="146">Bligh, not Cook</text>
    <text x="480" y="170" class="m">a floating nursery</text>
    <text x="700" y="98" class="a">Bounty's launch</text>
    <text x="700" y="122" class="m">about 23 feet</text>
    <text x="700" y="146">19 men set out</text>
    <text x="700" y="170" class="m">18 reached Timor</text>
  </g>
  <text x="24" y="230" class="m" font-size="14">Resolution, Adventure, and Discovery are later ships. Providence and Assistant</text>
  <text x="24" y="252" class="m" font-size="14">carried the breadfruit that the Bounty did not deliver.</text>
</svg>
