<path d="M563.0 106 l-5 -3.2 v6.4 z" fill="#7a4b1e"/>
<rect x="564.0" y="76" width="172.0" height="62" fill="none" stroke="#d9cfbf" stroke-width="0.8" rx="2"/>
<text x="650.0" y="100" font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size="14" fill="#22201c" text-anchor="middle" font-weight="700" font-style="normal">Raven</text>
<text x="650.0" y="120" font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size="11.5" fill="#6b645a" text-anchor="middle" font-weight="400" font-style="normal">stays: waters falling</text>
<text x="36" y="184" font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size="12" fill="#7a4b1e" text-anchor="start" font-weight="700" font-style="normal">Genesis 8</text>
