<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="420" viewBox="0 0 480 420" role="img" aria-labelledby="t d">
<title id="t">Same look, four times as big</title>
<desc id="d">An eye sees a sign 2 feet wide at 100 feet under the same angle as a sign 8 feet wide at 400 feet. One look, or one photograph of that angle, does not say which sign it is.</desc>
<rect width="480" height="420" fill="#fbf8f2"/>
<style>text { font-family: Georgia, 'Iowan Old Style', Palatino, 'Palatino Linotype', serif; fill: #22201c; }</style>
<text x="24" y="40" font-size="28" fill="#22201c" text-anchor="start">Same look, four times as big</text>
<text x="24" y="68" font-size="16" fill="#6b645a" text-anchor="start">Four times the width at four times the distance.</text>
<circle cx="56" cy="210" r="8" fill="#22201c"/>
<text x="56" y="248" font-size="16" fill="#22201c" text-anchor="middle">Eye</text>
<line x1="64" y1="210" x2="200" y2="170" stroke="#7a4b1e" stroke-width="1.6" stroke-linecap="round"/>
<line x1="64" y1="210" x2="200" y2="250" stroke="#7a4b1e" stroke-width="1.6" stroke-linecap="round"/>
<line x1="200" y1="170" x2="200" y2="250" stroke="#7a4b1e" stroke-width="3" stroke-linecap="round"/>
<text x="214" y="216" font-size="16" fill="#22201c" text-anchor="start">2 feet wide</text>
<text x="214" y="238" font-size="16" fill="#6b645a" text-anchor="start">at 100 feet</text>
<line x1="64" y1="210" x2="430" y2="150" stroke="#22201c" stroke-width="1.3" stroke-linecap="round"/>
<line x1="64" y1="210" x2="430" y2="270" stroke="#22201c" stroke-width="1.3" stroke-linecap="round"/>
<line x1="430" y1="150" x2="430" y2="270" stroke="#22201c" stroke-width="3" stroke-linecap="round"/>
<text x="300" y="120" font-size="16" fill="#22201c" text-anchor="start">8 feet wide</text>
<text x="300" y="142" font-size="16" fill="#6b645a" text-anchor="start">at 400 feet</text>
<text x="24" y="330" font-size="18" fill="#22201c" text-anchor="start">One look cannot tell these apart.</text>
<text x="24" y="358" font-size="16" fill="#6b645a" text-anchor="start">A photograph of the width has the same limit.</text>
<text x="24" y="390" font-size="15" fill="#6b645a" text-anchor="start">This is a teaching picture, not a measurement of the Moon.</text>
</svg>
