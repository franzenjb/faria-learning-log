<svg xmlns="http://www.w3.org/2000/svg" width="760" height="368" viewBox="0 0 760 368" role="img" aria-labelledby="tt td">
<title id="tt">Seven Virtues, Each Between Two Extremes</title>
<desc id="td">A strip of seven virtues from Aristotle’s Nicomachean Ethics. Each virtue sits between too little and too much: cowardice, courage, recklessness; insensibility, temperance, self-indulgence; stinginess, generosity, wastefulness; cheapness, magnificence, vulgarity; undue humility, proper pride, empty vanity; spiritless, good temper, short-tempered; self-deprecation, truthfulness, boastfulness. The virtue, in rust, is the proportion, not a bland midpoint.</desc>
<rect width="760" height="368" fill="#fbf8f2"/>
<text x="28" y="30" font-family="'Liberation Serif', Palatino, Georgia, serif" font-size="20" fill="#22201c" font-weight="700">Seven Virtues, Each Between Two Extremes</text>
<text x="28" y="52" font-family="'Liberation Serif', Palatino, Georgia, serif" font-size="12.5" fill="#6b645a">The virtue is the proportion, not a bland midpoint. It is the right amount, relative to us.</text>
<text x="130" y="82" font-family="'Liberation Serif', Palatino, Georgia, serif" font-size="11.5" fill="#6b645a" text-anchor="middle">Too little</text>
<text x="380" y="82" font-family="'Liberation Serif', Palatino, Georgia, serif" font-size="11.5" fill="#7a4b1e" text-anchor="middle" font-weight="700">The virtue</text>
<text x="630" y="82" font-family="'Liberation Serif', Palatino, Georgia, serif" font-size="11.5" fill="#6b645a" text-anchor="middle">Too much</text>
<line x1="28" y1="94" x2="732" y2="94" stroke="#d9cfbf" stroke-width="0.8"/>
