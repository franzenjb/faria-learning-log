<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" role="img" aria-labelledby="t2 d2">
<title id="t2">Part I argues, Part II proves it on himself</title>
<desc id="d2">Two columns. Left, Part I, Underground, eleven chapters written at forty: the claims. Right, Part II, Apropos of the Wet Snow, ten chapters remembering himself at twenty-four: the scenes. Lines join each claim to the scene that acts it out: the mouse that cannot revenge itself to the officer in the billiard room and the bump on Nevsky Prospect; consciousness as inertia to three hours pacing at Zverkov's dinner; the sublime and beautiful to the bookish speech to Liza; suffering as the source of consciousness to the five-rouble note and the question of cheap happiness or exalted suffering.</desc>
<rect width="760" height="450" fill="#fbf8f2"/>
<text x="40" y="38" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="22" fill="#22201c" text-anchor="start" font-weight="700" font-style="normal">Part I argues it. Part II proves it on himself.</text>
<text x="40" y="62" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="14" fill="#6b645a" text-anchor="start" font-weight="400" font-style="normal">Both parts are written at forty. The claims come first; the scenes happened sixteen years before.</text>
<text x="40" y="102" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="13" fill="#7a4b1e" text-anchor="start" font-weight="700" font-style="normal">PART I  ·  UNDERGROUND</text>
<text x="40" y="118" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="12" fill="#6b645a" text-anchor="start" font-weight="400" font-style="normal">11 chapters · the narrator at 40 · argument</text>
<text x="720" y="102" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="13" fill="#7a4b1e" text-anchor="end" font-weight="700" font-style="normal">PART II  ·  APROPOS OF THE WET SNOW</text>
<text x="720" y="118" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="12" fill="#6b645a" text-anchor="end" font-weight="400" font-style="normal">10 chapters · himself at 24 · story</text>
<text x="40" y="170" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="14" fill="#22201c" text-anchor="start" font-weight="400" font-style="normal">The acutely conscious mouse</text>
<text x="40" y="188" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="14" fill="#6b645a" text-anchor="start" font-weight="400" font-style="normal">cannot take revenge (ch. III)</text>
<text x="720" y="170" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="14" fill="#22201c" text-anchor="end" font-weight="400" font-style="normal">The officer moves him aside like a fly;</text>
<text x="720" y="188" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="14" fill="#6b645a" text-anchor="end" font-weight="400" font-style="normal">and later, the bump on Nevsky Prospect</text>
<line x1="300" y1="174" x2="420" y2="174" stroke="#7a4b1e" stroke-width="1.6"/>
<circle cx="300" cy="174" r="3" fill="#7a4b1e"/><circle cx="420" cy="174" r="3" fill="#7a4b1e"/>
<text x="40" y="242" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="14" fill="#22201c" text-anchor="start" font-weight="400" font-style="normal">Consciousness breeds inertia:</text>
<text x="40" y="260" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="14" fill="#6b645a" text-anchor="start" font-weight="400" font-style="normal">“better to do nothing” (ch. V, XI)</text>
<text x="720" y="242" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="14" fill="#22201c" text-anchor="end" font-weight="400" font-style="normal">Zverkov’s dinner: three hours pacing</text>
<text x="720" y="260" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="14" fill="#6b645a" text-anchor="end" font-weight="400" font-style="normal">from the table to the stove and back</text>
<line x1="300" y1="246" x2="420" y2="246" stroke="#7a4b1e" stroke-width="1.6"/>
<circle cx="300" cy="246" r="3" fill="#7a4b1e"/><circle cx="420" cy="246" r="3" fill="#7a4b1e"/>
<text x="40" y="314" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="14" fill="#22201c" text-anchor="start" font-weight="400" font-style="normal">Mockery of “the sublime and</text>
<text x="40" y="332" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="14" fill="#6b645a" text-anchor="start" font-weight="400" font-style="normal">beautiful” (ch. II, VI)</text>
<text x="720" y="314" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="14" fill="#22201c" text-anchor="end" font-weight="400" font-style="normal">His speech to Liza, “like a book”:</text>
<text x="720" y="332" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="14" fill="#6b645a" text-anchor="end" font-weight="400" font-style="normal">the coffin, the wet grave</text>
<line x1="300" y1="318" x2="420" y2="318" stroke="#7a4b1e" stroke-width="1.6"/>
<circle cx="300" cy="318" r="3" fill="#7a4b1e"/><circle cx="420" cy="318" r="3" fill="#7a4b1e"/>
<text x="40" y="386" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="14" fill="#22201c" text-anchor="start" font-weight="400" font-style="normal">Suffering is “the sole origin</text>
<text x="40" y="404" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="14" fill="#6b645a" text-anchor="start" font-weight="400" font-style="normal">of consciousness” (ch. IX)</text>
<text x="720" y="386" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="14" fill="#22201c" text-anchor="end" font-weight="400" font-style="normal">The five-rouble note left on the table:</text>
<text x="720" y="404" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="14" fill="#6b645a" text-anchor="end" font-weight="400" font-style="normal">cheap happiness or exalted suffering?</text>
<line x1="300" y1="390" x2="420" y2="390" stroke="#7a4b1e" stroke-width="1.6"/>
<circle cx="300" cy="390" r="3" fill="#7a4b1e"/><circle cx="420" cy="390" r="3" fill="#7a4b1e"/>
<text x="380" y="440" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="13" fill="#6b645a" text-anchor="middle" font-weight="400" font-style="italic">The editor gets the last word: the notes “do not end here,” but the book does.</text>
</svg>