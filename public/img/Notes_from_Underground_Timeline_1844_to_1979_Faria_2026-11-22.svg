<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="t1 d1">
<title id="t1">From the Crystal Palace to prospect theory</title>
<desc id="d1">A timeline from 1840 to 1985. Above the line, what came before: Dumas’s Monte Cristo of 1844, the Crystal Palace of 1851, Dostoevsky in London in 1862, and Chernyshevsky's novel of 1863. The novella itself appears in 1864. Below the line, its descendants: Chekhov 1883, Nietzsche 1887, Kafka and Eliot 1915, Kafka again 1931, and Kahneman and Tversky 1979. Hamlet, about 1600, sits off the scale to the left.</desc>
<rect width="760" height="470" fill="#fbf8f2"/>
<text x="40" y="38" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="22" fill="#22201c" text-anchor="start" font-weight="700" font-style="normal">What the book answers, and what answered it</text>
<text x="40" y="62" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="14" fill="#6b645a" text-anchor="start" font-weight="400" font-style="normal">Above the line, what came before the book. Below, what came after it.</text>
