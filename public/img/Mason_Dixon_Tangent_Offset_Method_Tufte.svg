<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" role="img">
  <title>Mason and Dixon tangent method</title>
  <desc>A teaching sketch, not a measured error profile. A circle around New Castle, a trial tangent offset from an earlier point by 22.51 chains, the corrected tangent, and the east-west parallel. The offset is a routine correction, not a map of leftover survey error.</desc>
  <rect width="920" height="380" fill="#fbf8f2"/>
  <style>text{font-family:"Palatino Linotype",Palatino,"Liberation Serif",Georgia,serif;fill:#1c1915}.m{fill:#5e584e}.a{fill:#8c3f1e}</style>
  <text x="24" y="32" font-size="20">A circle, a tangent, then a parallel</text>
  <text x="24" y="54" class="m" font-size="14">Teaching sketch of the method. Not a plot of the finished survey's errors.</text>
  <circle cx="210" cy="210" r="90" fill="none" stroke="#6f675c" stroke-width="1.5"/>
  <circle cx="210" cy="210" r="3" fill="#1c1915"/>
  <text x="218" y="206" font-size="14">New Castle</text>
  <line x1="300" y1="130" x2="300" y2="300" stroke="#8a8175" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="308" y="150" class="m" font-size="14">trial tangent</text>
  <line x1="336" y1="130" x2="336" y2="300" stroke="#8c3f1e" stroke-width="1.8"/>
  <text x="346" y="168" class="a" font-size="14">corrected tangent</text>
  <line x1="300" y1="250" x2="336" y2="250" stroke="#8c3f1e" stroke-width="1.2"/>
  <text x="250" y="244" class="a" font-size="13">22.51 chains</text>
  <text x="248" y="262" class="m" font-size="13">about 1,486 feet</text>
  <line x1="430" y1="250" x2="860" y2="250" stroke="#1c1915" stroke-width="1.6"/>
  <text x="560" y="236" font-size="15">east-west parallel</text>
  <text x="430" y="278" class="m" font-size="14">Latitude from a zenith sector.</text>
  <text x="430" y="298" class="m" font-size="14">Chains for length, with slope taken out.</text>
  <text x="430" y="318" class="m" font-size="14">A locally straight piece is not yet the parallel.</text>
  <text x="24" y="350" class="m" font-size="14">The 22.51 chains is how far the trial line missed an earlier tangent point.</text>
  <text x="24" y="370" class="m" font-size="14">Mason remeasured it within a link. Offsets followed. This is not a restart.</text>
</svg>
