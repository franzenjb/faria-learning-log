<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img">
  <title>Hurricane Wind Force: Force Grows with Velocity Squared</title>
  <desc>Five bars for 100, 120, 140, 160, and 180 miles per hour, with air, area, and shape held fixed. Heights are the square of the speed ratio: 1.00, 1.44, 1.96, 2.56, and 3.24 times the force at 100 miles per hour. That is the baseline, then 44 percent more, 96 percent more, 156 percent more, and 224 percent more. The accent cap on each bar after the first is only the new piece from the latest 20 mile per hour step: 0.44, 0.52, 0.60, and 0.68 of the baseline force. Those additions grow. The whole force is not multiplied by one fixed factor.</desc>
  <rect width="920" height="460" fill="#fbf8f2"/>
  <style>text{font-family:"Palatino Linotype",Palatino,"Liberation Serif",Georgia,serif;fill:#1c1915}.m{fill:#5e584e}.a{fill:#8c3f1e}</style>
  <text x="24" y="32" font-size="20">Same wall, same air: force follows the square of the speed</text>
  <text x="24" y="54" class="m" font-size="14">Baseline is 100 mph. The miles per hour cancel in the ratio. Accent is only the new piece from the latest 20 mph.</text>
  <line x1="70" y1="348" x2="610" y2="348" stroke="#1c1915" stroke-width="1.2"/>
  <rect x="78" y="286.0" width="78" height="62.0" fill="#d9d3c7"/>
  <rect x="188" y="286.0" width="78" height="62.0" fill="#d9d3c7"/>
  <rect x="188" y="258.7" width="78" height="27.3" fill="#8c3f1e"/>
  <rect x="298" y="258.7" width="78" height="89.3" fill="#d9d3c7"/>
  <rect x="298" y="226.5" width="78" height="32.2" fill="#8c3f1e"/>
  <rect x="408" y="226.5" width="78" height="121.5" fill="#d9d3c7"/>
  <rect x="408" y="189.3" width="78" height="37.2" fill="#8c3f1e"/>
  <rect x="518" y="189.3" width="78" height="158.7" fill="#d9d3c7"/>
  <rect x="518" y="147.1" width="78" height="42.2" fill="#8c3f1e"/>
  <text x="84" y="258" font-size="13">1.00 times</text>
  <text x="90" y="276" class="m" font-size="12">baseline</text>
  <text x="192" y="230" font-size="13">1.44 times</text>
  <text x="196" y="248" class="a" font-size="12">44% more</text>
  <text x="302" y="198" font-size="13">1.96 times</text>
  <text x="304" y="216" class="a" font-size="12">96% more</text>
  <text x="412" y="160" font-size="13">2.56 times</text>
  <text x="410" y="178" class="a" font-size="12">156% more</text>
  <text x="522" y="118" font-size="13">3.24 times</text>
  <text x="518" y="136" class="a" font-size="12">224% more</text>
  <text x="90" y="368" font-size="14">100 mph</text>
  <text x="200" y="368" font-size="14">120 mph</text>
  <text x="310" y="368" font-size="14">140 mph</text>
  <text x="420" y="368" font-size="14">160 mph</text>
  <text x="530" y="368" font-size="14">180 mph</text>
  <text x="100" y="386" class="m" font-size="12">1.00</text>
  <text x="210" y="386" class="m" font-size="12">1.20</text>
  <text x="320" y="386" class="m" font-size="12">1.40</text>
  <text x="430" y="386" class="m" font-size="12">1.60</text>
  <text x="540" y="386" class="m" font-size="12">1.80</text>
  <text x="640" y="120" font-size="15">New piece, in baseline units</text>
  <text x="640" y="148" class="a" font-size="14">+0.44</text>
  <text x="700" y="148" class="m" font-size="13">from 100 to 120</text>
  <text x="640" y="172" class="a" font-size="14">+0.52</text>
  <text x="700" y="172" class="m" font-size="13">from 120 to 140</text>
  <text x="640" y="196" class="a" font-size="14">+0.60</text>
  <text x="700" y="196" class="m" font-size="13">from 140 to 160</text>
  <text x="640" y="220" class="a" font-size="14">+0.68</text>
  <text x="700" y="220" class="m" font-size="13">from 160 to 180</text>
  <text x="640" y="256" class="m" font-size="13">The additions grow.</text>
  <text x="640" y="276" class="m" font-size="13">The multiplier of the</text>
  <text x="640" y="294" class="m" font-size="13">whole force does not</text>
  <text x="640" y="312" class="m" font-size="13">stay fixed. It falls:</text>
  <text x="640" y="336" class="m" font-size="13">1.44, 1.36, 1.31, 1.27.</text>
  <text x="24" y="420" class="m" font-size="14">Gray is the force already present at the slower step. The numbers under the speeds are speed divided by 100. Square that number and you have the height.</text>
  <text x="24" y="442" class="m" font-size="14">1.44 times the baseline is 44 percent more, not 144 percent more. 3.24 times the baseline is 224 percent more. An exponential curve would keep one multiplier.</text>
</svg>
