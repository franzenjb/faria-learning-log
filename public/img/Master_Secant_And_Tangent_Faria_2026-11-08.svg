<svg xmlns="http://www.w3.org/2000/svg" width="480" height="264" viewBox="0 0 480 264" role="img" aria-labelledby="t d">
<title id="t">Average line and tangent</title><desc id="d">A rising cubic. The solid line joins two points that lie on the curve. The dashed line is the tangent at the later point, using the derivative there.</desc>
<rect width="480" height="264" fill="#fbf8f2"/>
<style>text { font-family: Georgia, 'Iowan Old Style', Palatino, 'Palatino Linotype', serif; fill: #22201c; }</style>
<text x="16" y="26" font-size="18" fill="#22201c" text-anchor="start">A straight line, then the curve's own direction</text>
<path d="M50 200 C120 190 150 120 250 70" fill="none" stroke="#7a4b1e" stroke-width="2.2"/>
<line x1="101.8067" y1="179.2442" x2="180.0493" y2="114.9478" stroke="#22201c" stroke-width="1.4"/>
<line x1="147.1118" y1="141.0078" x2="212.9867" y2="88.8878" stroke="#6b645a" stroke-width="1.3" stroke-dasharray="5 3"/>
<circle cx="101.8067" cy="179.2442" r="4" fill="#22201c"/>
<circle cx="180.0493" cy="114.9478" r="4" fill="#7a4b1e"/>
<text x="40" y="222" font-size="13" fill="#22201c" text-anchor="start">Straight line: average over the interval</text>
<text x="40" y="242" font-size="13" fill="#6b645a" text-anchor="start">Dashed line: the direction right now</text>
<text x="280" y="48" font-size="13" fill="#6b645a" text-anchor="start">Distance</text>
<text x="400" y="210" font-size="13" fill="#6b645a" text-anchor="start">Time</text>
<line x1="50" y1="200" x2="50" y2="40" stroke="#22201c" stroke-width="1.2"/>
<line x1="50" y1="200" x2="430" y2="200" stroke="#22201c" stroke-width="1.2"/></svg>