<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="256" viewBox="0 0 480 256" role="img" aria-labelledby="t d">
<title id="t">Average line and tangent</title><desc id="d">A rising curve. A straight line joins two points, the average over that interval. A second line follows the curve's direction at one point.</desc>
<rect width="480" height="256" fill="#fbf8f2"/>
<style>text { font-family: Georgia, 'Iowan Old Style', Palatino, 'Palatino Linotype', serif; fill: #22201c; }</style>
<text x="16" y="26" font-size="18" fill="#22201c" text-anchor="start">A straight line, then the curve's own direction</text>
<path d="M50 200 C120 190 150 120 250 70" fill="none" stroke="#7a4b1e" stroke-width="2.2"/>
<line x1="70" y1="188" x2="210" y2="100" stroke="#22201c" stroke-width="1.4"/>
<line x1="150" y1="150" x2="250" y2="70" stroke="#6b645a" stroke-width="1.3" stroke-dasharray="5 3"/>
<circle cx="90" cy="180" r="4" fill="#22201c"/>
<circle cx="190" cy="112" r="4" fill="#7a4b1e"/>
<text x="40" y="214" font-size="13" fill="#22201c" text-anchor="start">Straight line: average over the interval</text>
<text x="40" y="234" font-size="13" fill="#6b645a" text-anchor="start">Dashed line: the direction right now</text>
<text x="280" y="40" font-size="13" fill="#6b645a" text-anchor="start">Distance</text>
<text x="400" y="210" font-size="13" fill="#6b645a" text-anchor="start">Time</text>
<line x1="50" y1="200" x2="50" y2="40" stroke="#22201c" stroke-width="1.2"/>
<line x1="50" y1="200" x2="430" y2="200" stroke="#22201c" stroke-width="1.2"/></svg>