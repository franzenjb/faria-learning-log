<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="450" viewBox="0 0 480 450" role="img" aria-labelledby="t d">
<title id="t">Two reports, not two photographs</title>
<desc id="d">Alexandria and the Hellespont on the Earth, the Moon between them and a very far Sun. Sightlines differ. The drawing exaggerates the angles. These are eclipse reports, not photographs of the stars taken at the same moment.</desc>
<rect width="480" height="450" fill="#fbf8f2"/>
<style>text { font-family: Georgia, 'Iowan Old Style', Palatino, 'Palatino Linotype', serif; fill: #22201c; }</style>
<text x="24" y="36" font-size="24" fill="#22201c" text-anchor="start">Two reports, not two photographs</text>
<text x="24" y="62" font-size="16" fill="#6b645a" text-anchor="start">The Sun is the far wall. Angles are drawn large.</text>
<path d="M40 260 Q160 180 300 230" fill="none" stroke="#22201c" stroke-width="2"/>
<circle cx="50" cy="252" r="6" fill="#22201c"/>
<circle cx="218" cy="207" r="6" fill="#7a4b1e"/>
<text x="24" y="278" font-size="15" fill="#22201c" text-anchor="start">Alexandria</text>
<text x="228" y="232" font-size="15" fill="#7a4b1e" text-anchor="start">Hellespont</text>
<circle cx="250" cy="120" r="10" fill="#7a4b1e"/>
<text x="266" y="116" font-size="18" fill="#7a4b1e" text-anchor="start">Moon</text>
<line x1="50" y1="246" x2="250" y2="130" stroke="#22201c" stroke-width="1.5" stroke-linecap="round"/>
<line x1="218" y1="201" x2="250" y2="130" stroke="#7a4b1e" stroke-width="1.5" stroke-linecap="round"/>
<line x1="40" y1="150" x2="450" y2="150" stroke="#6b645a" stroke-width="1.2" stroke-linecap="round"/>
<line x1="40" y1="168" x2="450" y2="160" stroke="#6b645a" stroke-width="1.2" stroke-linecap="round"/>
<text x="330" y="142" font-size="16" fill="#6b645a" text-anchor="start">Sun, very far</text>
<text x="24" y="310" font-size="16" fill="#22201c" text-anchor="start">Total at the Hellespont.</text>
<text x="24" y="334" font-size="16" fill="#22201c" text-anchor="start">About four-fifths covered at Alexandria.</text>
<text x="24" y="358" font-size="16" fill="#22201c" text-anchor="start">The difference is a fifth of the Sun's width.</text>
<text x="24" y="382" font-size="16" fill="#22201c" text-anchor="start">That is a change of direction, not yet miles.</text>
<text x="24" y="410" font-size="16" fill="#6b645a" text-anchor="start">The miles come from the size of the Earth.</text>
</svg>
