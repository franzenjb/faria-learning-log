<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="740" height="320" viewBox="0 0 740 320" role="img" aria-labelledby="title desc">
  <title id="title">Pytheas's summer-solstice gnomon at Massalia</title>
  <desc id="desc">A vertical gnomon of length 120 casts a noon shadow of 41 and four fifths at the summer solstice in Massalia. The zenith distance is about 19.2 degrees, which implies a latitude of about 43 degrees. Marseille's true latitude is about 43.3 degrees.</desc>
  <rect width="740" height="320" fill="#fcfbf7"/>
  <g font-family="DejaVu Sans, Noto Sans, sans-serif" fill="#26363b">
    <text x="28" y="22" font-size="13" font-weight="700">Pytheas's Gnomon at Massalia, Noon on the Summer Solstice</text>
    <text x="28" y="40" font-size="11" fill="#637177">The ratio he reported: gnomon 120, shadow 41 4/5. The geometry has not changed, so the number can still be checked.</text>

    <!-- scale: 1 unit = 1.55 px; gnomon 120 -> 186 px; shadow 41.8 -> 64.8 px -->
    <!-- ground y=270; gnomon top y=84 -->
    <line x1="70" y1="270" x2="390" y2="270" stroke="#26363b" stroke-width="1.4"/>
    <line x1="200" y1="270" x2="200" y2="84" stroke="#26363b" stroke-width="2.2"/>
    <line x1="200" y1="270" x2="264.8" y2="270" stroke="#a95039" stroke-width="3.2"/>
    <!-- sun ray through gnomon top (200,84) and shadow end (264.8,270). Extended up only to y=58, below the subtitle. -->
    <line x1="190.9" y1="58" x2="264.8" y2="270" stroke="#c4a36a" stroke-width="1.2"/>
    <circle cx="178" cy="58" r="3.6" fill="#e8d3a8" stroke="#a95039" stroke-width="0.8"/>
    <text x="148" y="62" font-size="10" fill="#637177">Sun</text>

    <path d="M 200 258 L 212 258 L 212 270" fill="none" stroke="#26363b" stroke-width="1"/>
    <line x1="200" y1="84" x2="200" y2="56" stroke="#26363b" stroke-width="1" stroke-dasharray="2 3"/>
    <text x="208" y="66" font-size="10" fill="#637177">zenith</text>
    <path d="M 200 68 A 16 16 0 0 0 194.7 68.9" fill="none" stroke="#a95039" stroke-width="1.5"/>
    <text x="214" y="80" font-size="11" fill="#a95039" font-weight="700">z ≈ 19.2°</text>

    <text x="190" y="180" font-size="11" font-weight="700" text-anchor="end">120</text>
    <text x="190" y="194" font-size="9" fill="#637177" text-anchor="end">gnomon</text>
    <text x="232" y="286" font-size="11" font-weight="700" fill="#a95039" text-anchor="middle">41 4/5</text>
    <text x="232" y="300" font-size="9" fill="#637177" text-anchor="middle">shadow, north</text>

    <text x="420" y="100" font-size="12" font-weight="700">The check</text>
    <text x="420" y="122" font-size="11">shadow / gnomon = 41.8 / 120 = 0.348</text>
    <text x="420" y="142" font-size="11">zenith distance  z  = arctan(0.348) ≈ 19.2°</text>
    <text x="420" y="162" font-size="11">noon altitude  = 90° − 19.2° ≈ 70.8°</text>
    <text x="420" y="188" font-size="11">Add the Sun's solstice declination,</text>
    <text x="420" y="206" font-size="11">about 23.7° in Pytheas's century:</text>
    <text x="420" y="234" font-size="13" fill="#a95039" font-weight="700">latitude ≈ 19.2° + 23.7° ≈ 43°</text>
    <text x="420" y="256" font-size="11" fill="#637177">Marseille today is about 43.3° N.</text>
    <text x="420" y="274" font-size="11" fill="#637177">He reported a ratio, not a figure in degrees.</text>
  </g>
</svg>
