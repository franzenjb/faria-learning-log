<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="kt kd">
<title id="kt">How Khayyam found a cubic’s answer</title>
<desc id="kd">A right-opening parabola and a semicircle sitting on a horizontal line meet at a point in the upper right. A dotted line drops from that crossing to the horizontal line. The segment along the line, from the start to that foot, is labeled the length he was after. An illustration of the method, not a plate from his treatise.</desc>
<rect width="760" height="390" fill="#fbf8f2"/>
<text x="36" y="32" font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size="20" fill="#22201c" text-anchor="start" font-weight="700" font-style="normal">How Khayyam found a cubic’s answer</text>
<text x="36" y="54" font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size="12.5" fill="#6b645a" text-anchor="start" font-weight="400" font-style="normal">He drew two curves from the numbers he already knew. Where they met marked the length he needed.</text>
