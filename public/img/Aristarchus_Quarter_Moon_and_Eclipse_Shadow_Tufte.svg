<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img">
  <title>Aristarchus, two different triangles</title>
  <desc>Left: the quarter-moon right triangle. The angle at the Moon is 90 degrees. An assumed 87-degree elongation makes the Sun about 19 times the Moon's distance. The true half-moon is much closer to 90 degrees from the Sun, and the real ratio is about 400. Right: a lunar eclipse. Earth's shadow is a tapering cone because the Sun is an extended disk. Shadow width alone is not the distance. Angles are exaggerated.</desc>
  <rect width="920" height="460" fill="#fbf8f2"/>
  <style>text{font-family:"Palatino Linotype",Palatino,"Liberation Serif",Georgia,serif;fill:#1c1915}.m{fill:#5e584e}.a{fill:#8c3f1e}</style>
  <text x="24" y="30" font-size="18">Quarter Moon: a right angle</text>
  <circle cx="70" cy="200" r="8" fill="#8c3f1e"/>
  <text x="48" y="228" class="a" font-size="14">Sun</text>
  <circle cx="250" cy="80" r="6" fill="#1c1915"/>
  <text x="230" y="68" font-size="14">Moon</text>
  <circle cx="250" cy="250" r="7" fill="#1c1915"/>
  <text x="262" y="254" font-size="14">Earth</text>
  <line x1="78" y1="200" x2="250" y2="86" stroke="#1c1915" stroke-width="1.2"/>
  <line x1="250" y1="86" x2="250" y2="243" stroke="#1c1915" stroke-width="1.2"/>
  <line x1="78" y1="200" x2="243" y2="250" stroke="#8c3f1e" stroke-width="1.2"/>
  <path d="M250 110 L270 110 L270 90" fill="none" stroke="#1c1915" stroke-width="1"/>
  <text x="276" y="108" font-size="13">90 deg</text>
  <text x="150" y="250" class="a" font-size="13">87 deg assumed</text>
  <text x="24" y="300" class="m" font-size="13">This triangle puts the Sun about</text>
  <text x="24" y="318" class="m" font-size="13">19 times the Moon's distance.</text>
  <text x="24" y="340" class="m" font-size="13">A true half is nearer 90 deg</text>
  <text x="24" y="358" class="m" font-size="13">from the Sun: the ratio is ~400.</text>
  <line x1="460" y1="48" x2="460" y2="400" stroke="#e4dccf" stroke-width="1"/>
  <text x="480" y="30" font-size="18">Lunar eclipse: a tapering shadow</text>
  <circle cx="530" cy="160" r="28" fill="#8c3f1e"/>
  <text x="512" y="164" fill="#fbf8f2" font-size="12">Sun</text>
  <circle cx="700" cy="160" r="10" fill="#1c1915"/>
  <text x="688" y="196" font-size="13">Earth</text>
  <polygon points="700,150 860,120 860,200 700,170" fill="#e7e0d4" stroke="#6f675c" stroke-width="1"/>
  <circle cx="790" cy="145" r="6" fill="#1c1915"/>
  <text x="770" y="112" font-size="13">Moon</text>
  <text x="760" y="230" class="m" font-size="13">umbra tapers</text>
  <text x="480" y="280" class="m" font-size="13">Need the Moon's angular size</text>
  <text x="480" y="300" class="m" font-size="13">and the Sun's width.</text>
  <text x="480" y="324" class="m" font-size="13">Shadow width alone is not</text>
  <text x="480" y="344" class="m" font-size="13">a distance. Angles enlarged.</text>
  <text x="24" y="420" class="m" font-size="14">Left is the half-moon triangle. Right is an eclipse. They answer different questions.</text>
  <text x="24" y="442" class="m" font-size="14">Neither drawing is to scale. The surviving treatise is not the lost heliocentric book.</text>
</svg>
