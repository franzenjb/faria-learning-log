<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="450" viewBox="0 0 480 450" role="img" aria-labelledby="t d">
<title id="t">The finger stays still</title>
<desc id="d">Two eyes look past one finger at a far wall. The left eye lines the finger up with the right-hand mark. The right eye lines it up with the left-hand mark. The finger did not move.</desc>
<rect width="480" height="450" fill="#fbf8f2"/>
<style>text { font-family: Georgia, 'Iowan Old Style', Palatino, 'Palatino Linotype', serif; fill: #22201c; }</style>
<text x="24" y="36" font-size="28" fill="#22201c" text-anchor="start">The finger stays still</text>
<text x="24" y="64" font-size="16" fill="#6b645a" text-anchor="start">Only the eye moved. The wall is far.</text>
<line x1="50" y1="110" x2="430" y2="110" stroke="#e6dfd2" stroke-width="8" stroke-linecap="round"/>
<text x="240" y="98" font-size="16" fill="#6b645a" text-anchor="middle">Far wall</text>
<circle cx="140" cy="110" r="6" fill="#7a4b1e"/>
<circle cx="340" cy="110" r="6" fill="#22201c"/>
<text x="140" y="148" font-size="14" fill="#7a4b1e" text-anchor="middle">Right eye's mark</text>
<text x="340" y="148" font-size="14" fill="#22201c" text-anchor="middle">Left eye's mark</text>
<circle cx="240" cy="210" r="11" fill="#7a4b1e"/>
<text x="258" y="216" font-size="18" fill="#22201c" text-anchor="start">Finger</text>
<circle cx="140" cy="330" r="8" fill="#22201c"/>
<circle cx="340" cy="330" r="8" fill="#22201c"/>
<text x="140" y="360" font-size="16" fill="#22201c" text-anchor="middle">Left eye</text>
<text x="340" y="360" font-size="16" fill="#22201c" text-anchor="middle">Right eye</text>
<line x1="140" y1="322" x2="240" y2="220" stroke="#22201c" stroke-width="1.5" stroke-linecap="round"/>
<line x1="240" y1="200" x2="340" y2="116" stroke="#7a4b1e" stroke-width="1.6" stroke-linecap="round"/>
<line x1="340" y1="322" x2="240" y2="220" stroke="#22201c" stroke-width="1.5" stroke-linecap="round"/>
<line x1="240" y1="200" x2="140" y2="116" stroke="#7a4b1e" stroke-width="1.6" stroke-linecap="round"/>
<text x="24" y="400" font-size="16" fill="#6b645a" text-anchor="start">The gap between the eyes is the baseline.</text>
<text x="24" y="424" font-size="16" fill="#6b645a" text-anchor="start">It was measured on you, not on the wall.</text>
</svg>
