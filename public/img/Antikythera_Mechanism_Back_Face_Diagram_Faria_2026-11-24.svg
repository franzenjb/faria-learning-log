<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img" aria-labelledby="tt td">
<title id="tt">The back of the Antikythera mechanism: two spiral dials</title>
<desc id="td">A labeled diagram of the back face. The upper spiral is the 19-year Metonic calendar, with a small Games dial beside it. The lower spiral is the Saros eclipse-prediction dial, with a small Exeligmos dial beside it.</desc>
<rect width="800" height="620" fill="#fbf8f2"/>
<text x='28.0' y='32.0' font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size='20' fill='#22201c' text-anchor='start' font-weight='700'>The back: two spiral dials</text>
<text x='28.0' y='52.0' font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size='11.5' fill='#6b645a' text-anchor='start'>This layout is well established from the 2005 scans and from the 2006 and 2008 papers. The spirals themselves survive in the fragments.</text>
