<text x='530.0' y='185.0' font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size='12.5' fill='#22201c' text-anchor='start'>Nineteen solar years hold 235</text>
<text x='530.0' y='201.0' font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size='12.5' fill='#22201c' text-anchor='start'>lunar months. After 19 years,</text>
