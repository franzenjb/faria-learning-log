<text x='530.0' y='400.0' font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size='14.5' fill='#7a4b1e' text-anchor='start' font-weight='700'>Lower spiral</text>
<text x='530.0' y='420.0' font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size='12.5' fill='#22201c' text-anchor='start'>After 223 lunar months,</text>
<text x='530.0' y='436.0' font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size='12.5' fill='#22201c' text-anchor='start'>eclipses come back in a</text>
<text x='530.0' y='452.0' font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size='12.5' fill='#22201c' text-anchor='start'>recognizable pattern. Marks</text>
<text x='530.0' y='468.0' font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size='12.5' fill='#22201c' text-anchor='start'>on the spiral told the user</text>
<text x='530.0' y='484.0' font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size='12.5' fill='#22201c' text-anchor='start'>when one was due, and whether</text>
<text x='530.0' y='500.0' font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size='12.5' fill='#22201c' text-anchor='start'>it was of the Sun or the Moon.</text>
<text x='28.0' y='604.0' font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size='11.5' fill='#6b645a' text-anchor='start' font-style='italic'>A pointer followed each spiral from the inside out, then jumped back to the start.  This is the better-preserved face of the machine.</text>
