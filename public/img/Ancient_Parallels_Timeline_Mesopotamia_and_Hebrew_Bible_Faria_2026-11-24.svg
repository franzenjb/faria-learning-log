<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="tt td">
<title id="tt">From Sumer to the exile</title>
<desc id="td">A linear timeline from about 3200 BCE to 500 BCE. Marks: writing in Sumer and Egypt about 3200 BCE; the laws of Ur-Nammu about 2100; Hammurabi about 1750; the Standard Babylonian Gilgamesh and Enuma Elish in the late second millennium; Judah's exile in Babylon about 587 to 539 BCE, when the Hebrew Bible was being shaped among these older stories.</desc>
<rect width="760" height="300" fill="#fbf8f2"/>
<text x="36" y="32" font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size="20" fill="#22201c" text-anchor="start" font-weight="700" font-style="normal">From Sumer to the exile</text>
<text x="36" y="54" font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size="12.5" fill="#6b645a" text-anchor="start" font-weight="400" font-style="normal">A linear scale, about 3200 to 500 BCE. Dates are approximate. The Hebrew Bible was not written in a single year.</text>
<line x1="36.0" y1="168" x2="724.0" y2="168" stroke="#7a4b1e" stroke-width="1.6"/>
<line x1="86.96296296296296" y1="164" x2="86.96296296296296" y2="172" stroke="#d9cfbf" stroke-width="1"/>
<text x="86.96296296296296" y="188" font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size="9.5" fill="#8a8278" text-anchor="middle" font-weight="400" font-style="normal">3000</text>
<line x1="214.37037037037035" y1="164" x2="214.37037037037035" y2="172" stroke="#d9cfbf" stroke-width="1"/>
<text x="214.37037037037035" y="188" font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size="9.5" fill="#8a8278" text-anchor="middle" font-weight="400" font-style="normal">2500</text>
<line x1="341.77777777777777" y1="164" x2="341.77777777777777" y2="172" stroke="#d9cfbf" stroke-width="1"/>
<text x="341.77777777777777" y="188" font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size="9.5" fill="#8a8278" text-anchor="middle" font-weight="400" font-style="normal">2000</text>
<line x1="469.1851851851852" y1="164" x2="469.1851851851852" y2="172" stroke="#d9cfbf" stroke-width="1"/>
<text x="469.1851851851852" y="188" font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size="9.5" fill="#8a8278" text-anchor="middle" font-weight="400" font-style="normal">1500</text>
<line x1="596.5925925925926" y1="164" x2="596.5925925925926" y2="172" stroke="#d9cfbf" stroke-width="1"/>
<text x="596.5925925925926" y="188" font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size="9.5" fill="#8a8278" text-anchor="middle" font-weight="400" font-style="normal">1000</text>
<line x1="724.0" y1="164" x2="724.0" y2="172" stroke="#d9cfbf" stroke-width="1"/>
<text x="724.0" y="188" font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size="9.5" fill="#8a8278" text-anchor="middle" font-weight="400" font-style="normal">500 BCE</text>
<line x1="36.0" y1="168" x2="36.0" y2="150" stroke="#7a4b1e" stroke-width="1.4"/>
<circle cx="36.0" cy="168" r="3.2" fill="#7a4b1e"/>
<text x="36.0" y="106" font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size="10.5" fill="#7a4b1e" text-anchor="start" font-weight="700" font-style="normal">about 3200 BCE</text>
<text x="36.0" y="122" font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size="13" fill="#22201c" text-anchor="start" font-weight="400" font-style="normal">Writing in Sumer</text>
<text x="36.0" y="138" font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size="13" fill="#22201c" text-anchor="start" font-weight="400" font-style="normal">and in Egypt</text>
<line x1="316.2962962962963" y1="168" x2="316.2962962962963" y2="186" stroke="#7a4b1e" stroke-width="1.4"/>
<circle cx="316.2962962962963" cy="168" r="3.2" fill="#7a4b1e"/>
<text x="316.2962962962963" y="202" font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size="10.5" fill="#7a4b1e" text-anchor="middle" font-weight="700" font-style="normal">about 2100</text>
<text x="316.2962962962963" y="218" font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size="13" fill="#22201c" text-anchor="middle" font-weight="400" font-style="normal">Laws of Ur-Nammu</text>
<line x1="405.4814814814815" y1="168" x2="405.4814814814815" y2="150" stroke="#7a4b1e" stroke-width="1.4"/>
<circle cx="405.4814814814815" cy="168" r="3.2" fill="#7a4b1e"/>
<text x="405.4814814814815" y="122" font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size="10.5" fill="#7a4b1e" text-anchor="middle" font-weight="700" font-style="normal">about 1750</text>
<text x="405.4814814814815" y="138" font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size="13" fill="#22201c" text-anchor="middle" font-weight="400" font-style="normal">Hammurabi's laws</text>
<line x1="545.6296296296296" y1="168" x2="545.6296296296296" y2="186" stroke="#7a4b1e" stroke-width="1.4"/>
<circle cx="545.6296296296296" cy="168" r="3.2" fill="#7a4b1e"/>
<text x="545.6296296296296" y="202" font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size="10.5" fill="#7a4b1e" text-anchor="middle" font-weight="700" font-style="normal">late 2nd millennium</text>
<text x="545.6296296296296" y="218" font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size="13" fill="#22201c" text-anchor="middle" font-weight="400" font-style="normal">Standard Gilgamesh;</text>
<text x="545.6296296296296" y="234" font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size="13" fill="#22201c" text-anchor="middle" font-weight="400" font-style="normal">Enuma Elish</text>
<line x1="707.9466666666667" y1="168" x2="707.9466666666667" y2="150" stroke="#7a4b1e" stroke-width="1.4"/>
<circle cx="707.9466666666667" cy="168" r="3.2" fill="#7a4b1e"/>
<text x="707.9466666666667" y="106" font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size="10.5" fill="#7a4b1e" text-anchor="end" font-weight="700" font-style="normal">about 587–539</text>
<text x="707.9466666666667" y="122" font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size="13" fill="#22201c" text-anchor="end" font-weight="400" font-style="normal">Judah's exile</text>
<text x="707.9466666666667" y="138" font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size="13" fill="#22201c" text-anchor="end" font-weight="400" font-style="normal">in Babylon</text>
<text x="36" y="286" font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size="12" fill="#6b645a" text-anchor="start" font-weight="400" font-style="italic">The last mark is late: the older stories were already ancient when Judah's exiles lived among them.</text>
</svg>