<text x="249.83783783783784" y="220" font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size="13" fill="#22201c" text-anchor="middle">Joins the Academy</text>
<line x1="435.78378378378375" y1="168" x2="435.78378378378375" y2="150" stroke="#7a4b1e" stroke-width="1.4"/>
<circle cx="435.78378378378375" cy="168" r="3.2" fill="#7a4b1e"/>
<text x="435.78378378378375" y="96" font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size="10.5" fill="#7a4b1e" text-anchor="middle" font-weight="700">347</text>
<text x="435.78378378378375" y="112" font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size="13" fill="#22201c" text-anchor="middle">Plato dies;</text>
<text x="435.78378378378375" y="128" font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size="13" fill="#22201c" text-anchor="middle">he leaves</text>
<line x1="472.9729729729729" y1="168" x2="472.9729729729729" y2="186" stroke="#7a4b1e" stroke-width="1.4"/>
<circle cx="472.9729729729729" cy="168" r="3.2" fill="#7a4b1e"/>
<text x="472.9729729729729" y="204" font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size="10.5" fill="#7a4b1e" text-anchor="middle" font-weight="700">about 343</text>
<text x="472.9729729729729" y="220" font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size="13" fill="#22201c" text-anchor="middle">Tutors Alexander</text>
<line x1="547.3513513513512" y1="168" x2="547.3513513513512" y2="150" stroke="#7a4b1e" stroke-width="1.4"/>
<circle cx="547.3513513513512" cy="168" r="3.2" fill="#7a4b1e"/>
<text x="547.3513513513512" y="112" font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size="10.5" fill="#7a4b1e" text-anchor="middle" font-weight="700">about 335</text>
<text x="547.3513513513512" y="128" font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size="13" fill="#22201c" text-anchor="middle">The Lyceum</text>
<line x1="658.9189189189188" y1="168" x2="658.9189189189188" y2="186" stroke="#7a4b1e" stroke-width="1.4"/>
<circle cx="658.9189189189188" cy="168" r="3.2" fill="#7a4b1e"/>
<line x1="668.2162162162163" y1="168" x2="668.2162162162163" y2="150" stroke="#7a4b1e" stroke-width="1.4"/>
<circle cx="668.2162162162163" cy="168" r="3.2" fill="#7a4b1e"/>
<text x="724" y="120" font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size="10.5" fill="#7a4b1e" text-anchor="end" font-weight="700">322</text>
<text x="724" y="136" font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size="13" fill="#22201c" text-anchor="end">Dies at Chalcis</text>
<text x="724" y="204" font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size="10.5" fill="#7a4b1e" text-anchor="end" font-weight="700">323</text>
<text x="724" y="220" font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size="13" fill="#22201c" text-anchor="end">Leaves Athens</text>
<text x="36" y="286" font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size="12" fill="#6b645a" text-anchor="start" font-style="italic">The farewell that Athens must not “sin twice against philosophy” is later tradition.</text>
</svg>
