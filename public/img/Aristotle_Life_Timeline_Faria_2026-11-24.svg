<text x="221.94594594594597" y="188" font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size="9.5" fill="#8a8278" text-anchor="middle">370</text>
<line x1="314.91891891891896" y1="164" x2="314.91891891891896" y2="172" stroke="#d9cfbf" stroke-width="1"/>
<text x="314.91891891891896" y="188" font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size="9.5" fill="#8a8278" text-anchor="middle">360</text>
<line x1="407.89189189189193" y1="164" x2="407.89189189189193" y2="172" stroke="#d9cfbf" stroke-width="1"/>
