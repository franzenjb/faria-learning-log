<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="tt td">
<title id="tt">Aristotle, 384 to 322 BCE</title>
<desc id="td">A linear timeline from 384 BCE to 322 BCE. Marks: birth at Stagira in 384; joins Plato's Academy about 367; leaves after Plato's death in 347; tutors Alexander about 343; founds the Lyceum about 335; leaves Athens in 323; dies at Chalcis in 322.</desc>
<rect width="760" height="300" fill="#fbf8f2"/>
<text x="36" y="32" font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size="20" fill="#22201c" text-anchor="start" font-weight="700">Aristotle, 384 to 322 BCE</text>
<text x="36" y="54" font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size="12.5" fill="#6b645a" text-anchor="start">A linear scale. A few of the middle dates are traditional and approximate.</text>
