<text x="500.86486486486484" y="188" font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size="9.5" fill="#8a8278" text-anchor="middle">340</text>
<line x1="593.8378378378379" y1="164" x2="593.8378378378379" y2="172" stroke="#d9cfbf" stroke-width="1"/>
<text x="593.8378378378379" y="188" font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size="9.5" fill="#8a8278" text-anchor="middle">330</text>
<line x1="686.8108108108108" y1="164" x2="686.8108108108108" y2="172" stroke="#d9cfbf" stroke-width="1"/>
<text x="686.8108108108108" y="188" font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size="9.5" fill="#8a8278" text-anchor="middle">320</text>
<line x1="91.78378378378379" y1="168" x2="91.78378378378379" y2="150" stroke="#7a4b1e" stroke-width="1.4"/>
<circle cx="91.78378378378379" cy="168" r="3.2" fill="#7a4b1e"/>
<text x="91.78378378378379" y="112" font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size="10.5" fill="#7a4b1e" text-anchor="start" font-weight="700">384</text>
<text x="91.78378378378379" y="128" font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size="13" fill="#22201c" text-anchor="start">Born at Stagira</text>
<line x1="249.83783783783784" y1="168" x2="249.83783783783784" y2="186" stroke="#7a4b1e" stroke-width="1.4"/>
<circle cx="249.83783783783784" cy="168" r="3.2" fill="#7a4b1e"/>
