<line x1="36.0" y1="164" x2="36.0" y2="172" stroke="#d9cfbf" stroke-width="1"/>
<text x="36.0" y="188" font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size="9.5" fill="#8a8278" text-anchor="middle">390</text>
<line x1="128.97297297297297" y1="164" x2="128.97297297297297" y2="172" stroke="#d9cfbf" stroke-width="1"/>
<text x="128.97297297297297" y="188" font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size="9.5" fill="#8a8278" text-anchor="middle">380</text>
