<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="t1 d1">
<title id="t1">Three times out of the room</title>
<desc id="d1">A table of small multiples, one column for each of the three parts. Part I: Gregor comes out to reassure the chief clerk; his father drives him back with the chief clerk's stick and a newspaper; he is wounded squeezing through the door; Gregor still earns the money. Part II: he comes out to help after his mother faints at the sight of him; his father, now in a bank uniform, bombards him with apples; one lodges in his back; the father works again. Part III: he comes out drawn by Grete's violin; the lodgers see him and give notice, and Grete says they must try to get rid of it; he returns to his room and dies before dawn; all three family members work.</desc>
<rect width="760" height="500" fill="#fbf8f2"/>
<text x="40" y="38" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="22" fill="#22201c" text-anchor="start" font-weight="700" font-style="normal">Three times out of the room, three times driven back</text>
<text x="40" y="62" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="14" fill="#6b645a" text-anchor="start" font-weight="400" font-style="normal">Each part of the story turns on one escape. Each costs Gregor more, and gives the family more reason.</text>
<text x="40" y="130" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="14" fill="#7a4b1e" text-anchor="start" font-weight="400" font-style="normal">Why he comes out</text>
<line x1="40" y1="104" x2="720" y2="104" stroke="#d9cfbf" stroke-width="1"/>
<text x="40" y="218" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="14" fill="#7a4b1e" text-anchor="start" font-weight="400" font-style="normal">Who drives him back</text>
<line x1="40" y1="192" x2="720" y2="192" stroke="#d9cfbf" stroke-width="1"/>
<text x="40" y="306" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="14" fill="#7a4b1e" text-anchor="start" font-weight="400" font-style="normal">What it costs him</text>
<line x1="40" y1="280" x2="720" y2="280" stroke="#d9cfbf" stroke-width="1"/>
<text x="40" y="394" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="14" fill="#7a4b1e" text-anchor="start" font-weight="400" font-style="normal">Who earns the money</text>
<line x1="40" y1="368" x2="720" y2="368" stroke="#d9cfbf" stroke-width="1"/>
<text x="215" y="96" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="13" fill="#7a4b1e" text-anchor="start" font-weight="700" font-style="normal">PART I</text>
<text x="215" y="130" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="13.5" fill="#22201c" text-anchor="start" font-weight="400" font-style="normal">To reassure the chief clerk</text>
<text x="215" y="148" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="13.5" fill="#6b645a" text-anchor="start" font-weight="400" font-style="normal">that he can still go to work</text>
<text x="215" y="218" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="13.5" fill="#22201c" text-anchor="start" font-weight="400" font-style="normal">His father, with the clerk’s</text>
<text x="215" y="236" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="13.5" fill="#6b645a" text-anchor="start" font-weight="400" font-style="normal">stick and a newspaper</text>
<text x="215" y="306" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="13.5" fill="#22201c" text-anchor="start" font-weight="400" font-style="normal">Scraped raw squeezing</text>
<text x="215" y="324" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="13.5" fill="#6b645a" text-anchor="start" font-weight="400" font-style="normal">through the doorway</text>
<text x="215" y="394" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="13.5" fill="#22201c" text-anchor="start" font-weight="400" font-style="normal">Gregor (until that morning)</text>
<text x="390" y="96" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="13" fill="#7a4b1e" text-anchor="start" font-weight="700" font-style="normal">PART II</text>
<text x="390" y="130" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="13.5" fill="#22201c" text-anchor="start" font-weight="400" font-style="normal">To help, after his mother</text>
<text x="390" y="148" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="13.5" fill="#6b645a" text-anchor="start" font-weight="400" font-style="normal">faints at the sight of him</text>
<text x="390" y="218" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="13.5" fill="#22201c" text-anchor="start" font-weight="400" font-style="normal">His father, back from work</text>
<text x="390" y="236" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="13.5" fill="#6b645a" text-anchor="start" font-weight="400" font-style="normal">in a uniform, with apples</text>
<text x="390" y="306" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="13.5" fill="#22201c" text-anchor="start" font-weight="400" font-style="normal">An apple lodges in his back</text>
<text x="390" y="324" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="13.5" fill="#6b645a" text-anchor="start" font-weight="400" font-style="normal">and stays there, rotting</text>
<text x="390" y="394" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="13.5" fill="#22201c" text-anchor="start" font-weight="400" font-style="normal">Father takes a job</text>
<text x="565" y="96" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="13" fill="#7a4b1e" text-anchor="start" font-weight="700" font-style="normal">PART III</text>
<text x="565" y="130" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="13.5" fill="#22201c" text-anchor="start" font-weight="400" font-style="normal">Drawn by Grete’s violin,</text>
<text x="565" y="148" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="13.5" fill="#6b645a" text-anchor="start" font-weight="400" font-style="normal">played for the lodgers</text>
<text x="565" y="218" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="13.5" fill="#22201c" text-anchor="start" font-weight="400" font-style="normal">Grete: “we have to try</text>
<text x="565" y="236" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="13.5" fill="#6b645a" text-anchor="start" font-weight="400" font-style="normal">and get rid of it”</text>
<text x="565" y="306" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="13.5" fill="#22201c" text-anchor="start" font-weight="400" font-style="normal">He goes back in, and dies</text>
<text x="565" y="324" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="13.5" fill="#6b645a" text-anchor="start" font-weight="400" font-style="normal">before dawn</text>
<text x="565" y="394" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="13.5" fill="#22201c" text-anchor="start" font-weight="400" font-style="normal">Father, mother and Grete</text>
<line x1="215" y1="470" x2="700" y2="470" stroke="#7a4b1e" stroke-width="1.4"/>
<path d="M700 470 l-8 -4 v8 z" fill="#7a4b1e"/>
<text x="215" y="490" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="13" fill="#6b645a" text-anchor="start" font-weight="400" font-style="italic">from the stick, to the apple, to his sister’s verdict</text>
</svg>