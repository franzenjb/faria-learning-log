<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
<title id="title">A circle, a degree, an arcminute, an arcsecond</title>
<desc id="desc">A full circle is 360 degrees. One degree, shown as a thin wedge, is opened up into 60 arcminutes. One arcminute is opened up into 60 arcseconds. So one arcsecond is 1/3,600 of a degree.</desc>
<rect width="760" height="430" fill="#fbf8f2"/>
<text x="30" y="36" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="21" fill="#22201c">Each step is sixty times finer</text>
<text x="30" y="60" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="14" fill="#6b645a">A circle, then one degree opened up, then one arcminute opened up.</text>
<circle cx="150" cy="245" r="105" fill="none" stroke="#22201c" stroke-width="1.2"/>
<line x1="255.0" y1="245.0" x2="247.0" y2="245.0" stroke="#22201c" stroke-width="1"/>
