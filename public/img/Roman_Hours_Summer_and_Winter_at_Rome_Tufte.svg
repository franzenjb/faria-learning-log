<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="740" height="312" viewBox="0 0 740 312" role="img" aria-labelledby="title desc">
  <title id="title">Roman daylight hours at Rome, summer and winter</title>
  <desc id="desc">Two 24-hour bars for Rome. In summer, daylight lasts 15 hours 6 minutes and each of the 12 day hours is about 75 minutes. In winter, daylight lasts 8 hours 54 minutes and each day hour is about 45 minutes. Night hours swap length with the day hours. Noon sits at the middle of daylight in both seasons.</desc>
  <rect width="740" height="312" fill="#fcfbf7"/>
  <g font-family="DejaVu Sans, Noto Sans, sans-serif" fill="#26363b">
    <text x="40" y="26" font-size="13" font-weight="700">A Roman Hour at Rome, About 42° N</text>
    <text x="40" y="46" font-size="11" fill="#637177">Daylight, sunrise to sunset, was always twelve hours. The hours stretched in summer and shrank in winter.</text>

    <!-- 24h scale: x = 40 + t * 27.5, t in hours from midnight; 24h ends at 700 -->
    <!-- Summer sunrise 4:27 = 4.45 h → 162.375; noon 12 → 370; sunset 19:33 = 19.55 → 577.625 -->
    <!-- Winter sunrise 7:33 = 7.55 h → 247.625; sunset 16:27 = 16.45 → 492.375 -->

    <text x="40" y="74" font-size="11" font-weight="700">Summer solstice</text>
    <text x="700" y="74" font-size="11" fill="#a95039" font-weight="700" text-anchor="end">each daylight hour ≈ 75 min</text>

    <!-- summer night / day / night -->
    <rect x="40" y="84" width="660" height="28" fill="#d9dee0"/>
    <rect x="162.4" y="84" width="415.2" height="28" fill="#e8d3a8"/>
    <!-- 11 internal hour ticks in summer daylight -->
    <g stroke="#26363b" stroke-width="0.7" opacity="0.45">
      <line x1="196.98" y1="84" x2="196.98" y2="112"/>
      <line x1="231.56" y1="84" x2="231.56" y2="112"/>
      <line x1="266.15" y1="84" x2="266.15" y2="112"/>
      <line x1="300.73" y1="84" x2="300.73" y2="112"/>
      <line x1="335.31" y1="84" x2="335.31" y2="112"/>
      <line x1="404.48" y1="84" x2="404.48" y2="112"/>
      <line x1="439.06" y1="84" x2="439.06" y2="112"/>
      <line x1="473.65" y1="84" x2="473.65" y2="112"/>
      <line x1="508.23" y1="84" x2="508.23" y2="112"/>
      <line x1="543.02" y1="84" x2="543.02" y2="112"/>
    </g>
    <!-- sunrise, noon, sunset -->
    <g stroke="#26363b" stroke-width="1.2">
      <line x1="162.4" y1="80" x2="162.4" y2="116"/>
      <line x1="577.6" y1="80" x2="577.6" y2="116"/>
    </g>
    <line x1="370" y1="78" x2="370" y2="118" stroke="#a95039" stroke-width="2"/>
    <text x="162.4" y="132" font-size="10" text-anchor="middle">Sunrise</text>
    <text x="162.4" y="144" font-size="9" fill="#637177" text-anchor="middle">4:27 a.m.</text>
    <text x="370" y="132" font-size="10" fill="#a95039" font-weight="700" text-anchor="middle">Noon</text>
    <text x="577.6" y="132" font-size="10" text-anchor="middle">Sunset</text>
    <text x="577.6" y="144" font-size="9" fill="#637177" text-anchor="middle">7:33 p.m.</text>
    <text x="370" y="144" font-size="9" fill="#a95039" text-anchor="middle">daylight 15 h 6 min</text>

    <text x="40" y="178" font-size="11" font-weight="700">Winter solstice</text>
    <text x="700" y="178" font-size="11" fill="#a95039" font-weight="700" text-anchor="end">each daylight hour ≈ 45 min</text>

    <rect x="40" y="188" width="660" height="28" fill="#d9dee0"/>
    <rect x="247.6" y="188" width="244.8" height="28" fill="#e8d3a8"/>
    <g stroke="#26363b" stroke-width="0.7" opacity="0.45">
      <line x1="268.0" y1="188" x2="268.0" y2="216"/>
      <line x1="288.4" y1="188" x2="288.4" y2="216"/>
      <line x1="308.8" y1="188" x2="308.8" y2="216"/>
      <line x1="329.2" y1="188" x2="329.2" y2="216"/>
      <line x1="349.6" y1="188" x2="349.6" y2="216"/>
      <line x1="390.4" y1="188" x2="390.4" y2="216"/>
      <line x1="410.8" y1="188" x2="410.8" y2="216"/>
      <line x1="431.2" y1="188" x2="431.2" y2="216"/>
      <line x1="451.6" y1="188" x2="451.6" y2="216"/>
      <line x1="472.0" y1="188" x2="472.0" y2="216"/>
    </g>
    <g stroke="#26363b" stroke-width="1.2">
      <line x1="247.6" y1="184" x2="247.6" y2="220"/>
      <line x1="492.4" y1="184" x2="492.4" y2="220"/>
    </g>
    <line x1="370" y1="182" x2="370" y2="222" stroke="#a95039" stroke-width="2"/>
    <text x="247.6" y="236" font-size="10" text-anchor="middle">Sunrise</text>
    <text x="247.6" y="248" font-size="9" fill="#637177" text-anchor="middle">7:33 a.m.</text>
    <text x="370" y="236" font-size="10" fill="#a95039" font-weight="700" text-anchor="middle">Noon</text>
    <text x="492.4" y="236" font-size="10" text-anchor="middle">Sunset</text>
    <text x="492.4" y="248" font-size="9" fill="#637177" text-anchor="middle">4:27 p.m.</text>
    <text x="370" y="248" font-size="9" fill="#a95039" text-anchor="middle">daylight 8 h 54 min</text>

    <!-- 24h end ticks and midnight labels -->
    <g stroke="#b8c0c0" stroke-width="1">
      <line x1="40" y1="84" x2="40" y2="112"/>
      <line x1="700" y1="84" x2="700" y2="112"/>
      <line x1="40" y1="188" x2="40" y2="216"/>
      <line x1="700" y1="188" x2="700" y2="216"/>
    </g>
    <text x="40" y="68" font-size="8" fill="#637177" text-anchor="middle">midnight</text>
    <text x="700" y="68" font-size="8" fill="#637177" text-anchor="middle">midnight</text>

    <text x="40" y="272" font-size="10" fill="#637177">Day lengths after Ideler, for Rome in 45 BC: 15 h 6 min in summer, 8 h 54 min in winter. The gold band is daylight.</text>
    <text x="40" y="286" font-size="10" fill="#637177">Night was also twelve hours, so the night hours swap: about 45 minutes in summer, 75 in winter.</text>
    <text x="40" y="300" font-size="10" fill="#637177">The two bars are the same 24 hours long. What the day gains, the night loses. Noon is the end of the sixth daylight hour.</text>
  </g>
</svg>
