<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" role="img">
  <title>Local solar noon, and a Greenwich chronometer reading 2:30</title>
  <desc>At the same instant the Sun is at its highest, which is local solar noon, a chronometer keeping Greenwich time reads 2:30. The hour hand lies between the 2 and the 3. The minute hand points at the 6. Two and a half hours is 37.5 degrees west, not 30.</desc>
  <rect width="680" height="320" fill="#fbf8f2"/>
  <style>text{font-family:"Palatino Linotype",Palatino,"Liberation Serif",Georgia,serif;fill:#1c1915}.m{fill:#5e584e}.a{fill:#8c3f1e}</style>
  <text x="24" y="28" font-size="18">Same instant: Sun highest, Greenwich reads 2:30</text>
  <text x="24" y="48" class="m" font-size="13">2 hours 30 minutes is 37.5 degrees west. Two hours alone would be only 30.</text>
  <path d="M70 168 Q160 78 250 168" fill="none" stroke="#c8c0b4" stroke-width="1.2"/>
  <circle cx="160" cy="100" r="16" fill="#f4efe6" stroke="#8c3f1e" stroke-width="1.4"/>
  <text x="148" y="105" class="a" font-size="12">Sun</text>
  <text x="92" y="196" font-size="14">Local solar noon</text>
  <text x="78" y="216" class="m" font-size="13">Sun highest, not civil 12</text>
  <circle cx="470" cy="148" r="78" fill="#fffdf8" stroke="#1c1915" stroke-width="1.4"/>
  <circle cx="470" cy="148" r="2.5" fill="#1c1915"/>
  <line x1="470" y1="78" x2="470" y2="88" stroke="#1c1915" stroke-width="1.2"/>
  <line x1="537.5" y1="109.0" x2="530.4" y2="113.1" stroke="#1c1915" stroke-width="1.2"/>
  <line x1="540" y1="148" x2="530" y2="148" stroke="#1c1915" stroke-width="1.2"/>
  <line x1="470" y1="218" x2="470" y2="208" stroke="#1c1915" stroke-width="1.2"/>
  <text x="462" y="68" font-size="13">12</text>
  <text x="546" y="104" font-size="13">2</text>
  <text x="552" y="152" font-size="13">3</text>
  <text x="464" y="242" font-size="13">6</text>
  <line x1="470" y1="148" x2="514.43" y2="136.09" stroke="#8c3f1e" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="470" y1="148" x2="470" y2="212" stroke="#1c1915" stroke-width="1.5" stroke-linecap="round"/>
  <text x="392" y="268" font-size="14">Greenwich chronometer</text>
  <text x="418" y="288" class="a" font-size="14">14:30, not 14:00</text>
  <text x="24" y="308" class="m" font-size="13">Hour hand halfway from 2 toward 3. That half hour is 7.5 degrees: 37.5 degrees west, not 30.</text>
</svg>
