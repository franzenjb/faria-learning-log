<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="280" viewBox="0 0 480 280" role="img" aria-labelledby="t d">
<title id="t">Split equilateral triangle</title><desc id="d">A 20-foot equilateral triangle split down the middle into two right triangles. Each base piece is 10 feet. A 30-degree angle is marked.</desc>
<rect width="480" height="280" fill="#fbf8f2"/>
<style>text { font-family: Georgia, 'Iowan Old Style', Palatino, 'Palatino Linotype', serif; fill: #22201c; }</style>
<text x="16" y="26" font-size="20" fill="#22201c" text-anchor="start">Split a 20-foot equilateral triangle</text>
<path d="M80 200 L200 40 L320 200 Z" fill="none" stroke="#7a4b1e" stroke-width="2"/>
<path d="M200 40 L200 200" fill="none" stroke="#22201c" stroke-width="1.4" stroke-dasharray="4 3"/>
<path d="M200 184 L216 184 L216 200" fill="none" stroke="#22201c" stroke-width="1.3"/>
<text x="140" y="224" font-size="14" fill="#6b645a" text-anchor="middle">10 ft</text>
<text x="260" y="224" font-size="14" fill="#6b645a" text-anchor="middle">10 ft</text>
<text x="118" y="120" font-size="14" fill="#7a4b1e" text-anchor="start">20 ft</text>
<text x="250" y="90" font-size="16" fill="#22201c" text-anchor="start">30°</text>
<text x="16" y="258" font-size="14" fill="#6b645a" text-anchor="start">Opposite 30° is 10. The long side is 20. Half is 10/20.</text></svg>