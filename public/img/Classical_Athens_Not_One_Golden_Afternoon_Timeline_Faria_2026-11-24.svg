<svg xmlns="http://www.w3.org/2000/svg" width="800" height="352" viewBox="0 0 800 352" role="img" aria-labelledby="tt2 td2">
<title id="tt2">Not One Golden Afternoon: Athens from Cleisthenes to the Lyceum</title>
<desc id="td2">A linear timeline from about 510 to 325 BCE. The upper register marks political and military events: Cleisthenes reforms, Salamis, the Parthenon, the Peloponnesian War, the plague and the death of Pericles, the Sicilian disaster, Persian gold, Aegospotami and the surrender of 404, the Thirty Tyrants, Theban hegemony, and Chaeronea. The lower register marks intellectual life: the life and execution of Socrates, Platos Academy, Aristotles arrival, his tutoring of Alexander, and the Lyceum. Power moves to Sparta, Thebes, and Macedon; the schools remain.</desc>
<rect width="800" height="352" fill="#fbf8f2"/>
<text x="28" y="26" font-family="'Liberation Serif', Palatino, Georgia, serif" font-size="20" fill="#22201c" font-weight="700">Not One Golden Afternoon</text>
<text x="28" y="46" font-family="'Liberation Serif', Palatino, Georgia, serif" font-size="12.5" fill="#6b645a">Power moved to Sparta, then Thebes, then Macedon. Athens remained the school of Greece.</text>
<text x="28" y="68" font-family="'Liberation Serif', Palatino, Georgia, serif" font-size="11.5" fill="#7a4b1e" font-weight="700">Political and military power</text>
<text x="28" y="268" font-family="'Liberation Serif', Palatino, Georgia, serif" font-size="11.5" fill="#7a4b1e" font-weight="700">Schools and thinking</text>
