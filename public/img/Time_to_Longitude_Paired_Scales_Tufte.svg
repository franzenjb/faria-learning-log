<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220" role="img" aria-labelledby="title desc">
  <title id="title">Time difference to longitude — paired scales</title>
  <desc id="desc">Aligned horizontal scales: time difference 0h, 1h, 2h, 2h35m corresponding to longitude 0°, 15°, 30°, 38°45′ west of Greenwich.</desc>
  <rect width="720" height="220" fill="#fcfbf7"/>
  <!-- geometry: map 0..2.5833 hours across usable width; 2h35m = 2 + 35/60 = 2.583333... -->
  <!-- left margin 72, right 648 → usable 576; scale by hours/3 so 0..3h span full? User said 0→3h with t15 etc but avoid clutter; endpoint at 38.75 proportional. Use 0..2.75h or 0..3h. Prefer 0..3h for clean ticks at 0,1,2 and endpoint at 2.5833. -->
  <g font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="12" fill="#26363b">
    <text x="72" y="28" font-size="13" font-weight="700">Paired scales — solar-time difference ↔ longitude west of Greenwich</text>
    <text x="72" y="48" font-size="11" fill="#637177">West increases to the right. Endpoint at 2 h 35 m = 38°45′ (38.75°) is placed in true proportion.</text>

    <!-- TIME scale -->
    <text x="36" y="92" font-size="11" font-weight="700" fill="#637177">TIME</text>
    <line x1="72" y1="88" x2="648" y2="88" stroke="#b8c0c0" stroke-width="1.2"/>
    <!-- ticks at 0,1,2,3 h and 2h35m -->
    <!-- x = 72 + (hours/3)*576 -->
    <!-- 0:72, 1:264, 2:456, 2.58333:72+496=568, 3:648 -->
    <g stroke="#26363b" stroke-width="1.4">
      <line x1="72" y1="80" x2="72" y2="96"/>
      <line x1="264" y1="80" x2="264" y2="96"/>
      <line x1="456" y1="80" x2="456" y2="96"/>
      <line x1="648" y1="80" x2="648" y2="96"/>
    </g>
    <g stroke="#a95039" stroke-width="2">
      <line x1="568" y1="76" x2="568" y2="100"/>
    </g>
    <text x="72" y="114" text-anchor="middle" font-size="11">0 h</text>
    <text x="264" y="114" text-anchor="middle" font-size="11">1 h</text>
    <text x="456" y="114" text-anchor="middle" font-size="11">2 h</text>
    <text x="568" y="114" text-anchor="middle" font-size="11" fill="#a95039" font-weight="700">2 h 35 m</text>
    <text x="648" y="114" text-anchor="middle" font-size="10" fill="#637177">3 h</text>

    <!-- connecting verticals -->
    <g stroke="#d5dbdb" stroke-width="1" stroke-dasharray="2 3">
      <line x1="72" y1="96" x2="72" y2="148"/>
      <line x1="264" y1="96" x2="264" y2="148"/>
      <line x1="456" y1="96" x2="456" y2="148"/>
      <line x1="568" y1="100" x2="568" y2="148"/>
      <line x1="648" y1="96" x2="648" y2="148"/>
    </g>

    <!-- LONGITUDE scale -->
    <text x="18" y="166" font-size="11" font-weight="700" fill="#637177">LONG.</text>
    <line x1="72" y1="160" x2="648" y2="160" stroke="#b8c0c0" stroke-width="1.2"/>
    <g stroke="#26363b" stroke-width="1.4">
      <line x1="72" y1="152" x2="72" y2="168"/>
      <line x1="264" y1="152" x2="264" y2="168"/>
      <line x1="456" y1="152" x2="456" y2="168"/>
      <line x1="648" y1="152" x2="648" y2="168"/>
    </g>
    <g stroke="#a95039" stroke-width="2">
      <line x1="568" y1="148" x2="568" y2="172"/>
    </g>
    <text x="72" y="188" text-anchor="middle" font-size="11">0°</text>
    <text x="264" y="188" text-anchor="middle" font-size="11">15°</text>
    <text x="456" y="188" text-anchor="middle" font-size="11">30°</text>
    <text x="568" y="188" text-anchor="middle" font-size="11" fill="#a95039" font-weight="700">38°45′</text>
    <text x="648" y="188" text-anchor="middle" font-size="10" fill="#637177">45°</text>

    <!-- west arrow -->
    <g fill="#a95039" stroke="#a95039">
      <line x1="500" y1="208" x2="620" y2="208" stroke-width="1.5"/>
      <polygon points="620,208 610,203 610,213"/>
      <text x="560" y="204" text-anchor="middle" font-size="11" font-weight="700" fill="#a95039" stroke="none">WEST of Greenwich →</text>
    </g>
  </g>
</svg>
