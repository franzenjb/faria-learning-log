<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img">
<title>A 20-foot ladder at 30 degrees</title>
<rect width="720" height="420" fill="#fbf8f2"/>
<text x="36" y="40" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="22" fill="#22201c">Same triangle, three questions</text>
<path d="M120 320 L120 160 L397 320 Z" fill="none" stroke="#7a4b1e" stroke-width="2.4"/>
<path d="M120 300 L140 300 L140 320" fill="none" stroke="#22201c" stroke-width="1.6"/>
<text x="96" y="250" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="16" fill="#22201c">10 ft</text>
<text x="220" y="350" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="16" fill="#22201c">about 17.32 ft</text>
<text x="230" y="230" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="16" fill="#7a4b1e">ladder 20 ft</text>
<text x="300" y="300" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="16" fill="#22201c">30&#176; at the ground</text>
<text x="430" y="140" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="16" fill="#22201c">Sine: height / ladder</text>
<text x="430" y="168" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="16" fill="#22201c">Cosine: base / ladder</text>
<text x="430" y="196" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="16" fill="#22201c">Tangent: height / base</text>
<text x="36" y="400" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="14" fill="#6b645a">Paper example. Not a rule for setting a real ladder.</text>
</svg>
