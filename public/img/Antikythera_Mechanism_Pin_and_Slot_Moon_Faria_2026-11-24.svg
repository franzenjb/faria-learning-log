<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="tt td">
<title id="tt">The pin-and-slot: how the machine copies the Moon's uneven pace</title>
<desc id="td">Two overlapping gears. The input gear turns steadily about its center. A pin on that gear rides in a slot on the second gear, whose center is slightly offset, so the output speeds up and slows down once per turn, as the real Moon does.</desc>
<rect width="800" height="360" fill="#fbf8f2"/>
<text x='28.0' y='32.0' font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size='20' fill='#22201c' text-anchor='start' font-weight='700'>The pin-and-slot: the Moon's uneven pace, in bronze</text>
