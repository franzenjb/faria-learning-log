<text x='28.0' y='332.0' font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size='12' fill='#22201c' text-anchor='start'>The real Moon does not travel at a steady pace around the sky. In the second century BC, Hipparchus described that unevenness.</text>
<text x='28.0' y='348.0' font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size='12' fill='#22201c' text-anchor='start'>Inside this machine, a pin riding in a slot on a slightly off-center gear makes a pointer do the same thing.</text>
