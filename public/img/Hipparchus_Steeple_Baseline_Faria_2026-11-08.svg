<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="490" viewBox="0 0 480 490" role="img" aria-labelledby="t d">
<title id="t">Two directions, one baseline</title>
<desc id="d">South and North stand 6 measured miles apart. Each lines the steeple up against a distant hill. The hill's direction is shared. The steeple's direction is not. The two sightlines differ by 1 degree at the steeple, drawn large. The distance is about 57 times 6 miles, 342 miles.</desc>
<rect width="480" height="490" fill="#fbf8f2"/>
<style>text { font-family: Georgia, 'Iowan Old Style', Palatino, 'Palatino Linotype', serif; fill: #22201c; }</style>
<text x="24" y="36" font-size="26" fill="#22201c" text-anchor="start">Two directions, one baseline</text>
<text x="24" y="62" font-size="16" fill="#6b645a" text-anchor="start">A made-up steeple. Not Hipparchus, and not the Moon.</text>
<line x1="70" y1="250" x2="250" y2="250" stroke="#22201c" stroke-width="2" stroke-linecap="round"/>
<circle cx="70" cy="250" r="7" fill="#22201c"/>
<circle cx="250" cy="250" r="7" fill="#22201c"/>
<text x="70" y="278" font-size="16" fill="#22201c" text-anchor="middle">South</text>
<text x="250" y="278" font-size="16" fill="#22201c" text-anchor="middle">North</text>
<text x="160" y="298" font-size="16" fill="#7a4b1e" text-anchor="middle">6 miles, measured</text>
<line x1="70" y1="250" x2="390" y2="110" stroke="#e6dfd2" stroke-width="1.4" stroke-linecap="round"/>
<line x1="250" y1="250" x2="390" y2="110" stroke="#e6dfd2" stroke-width="1.4" stroke-linecap="round"/>
<circle cx="390" cy="110" r="6" fill="#6b645a"/>
<text x="360" y="146" font-size="16" fill="#6b645a" text-anchor="start">Far hill</text>
<line x1="70" y1="250" x2="168" y2="120" stroke="#7a4b1e" stroke-width="1.8" stroke-linecap="round"/>
<line x1="250" y1="250" x2="168" y2="120" stroke="#7a4b1e" stroke-width="1.8" stroke-linecap="round"/>
<circle cx="168" cy="120" r="8" fill="#7a4b1e"/>
<text x="180" y="112" font-size="18" fill="#7a4b1e" text-anchor="start">Steeple</text>
<text x="24" y="350" font-size="16" fill="#22201c" text-anchor="start">The hill does not shift: it is too far. The steeple does.</text>
<text x="24" y="376" font-size="16" fill="#22201c" text-anchor="start">The two rust lines differ by 1 degree at the steeple.</text>
<text x="24" y="402" font-size="15" fill="#6b645a" text-anchor="start">Here that angle is drawn large so the crossing can be seen.</text>
<text x="24" y="428" font-size="16" fill="#22201c" text-anchor="start">About 57 baselines fit into that distance.</text>
<text x="24" y="452" font-size="16" fill="#22201c" text-anchor="start">57 times 6 miles is 342 miles.</text>
</svg>
