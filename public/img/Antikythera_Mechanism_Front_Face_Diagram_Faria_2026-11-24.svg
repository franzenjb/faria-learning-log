<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="tt td">
<title id="tt">The front of the Antikythera mechanism: a cosmos in rings</title>
<desc id="td">A labeled diagram of the front face, after the 2021 reconstruction. From the center: the Earth and the Moon's phase, then rings for Mercury, Venus, the Sun, Mars, Jupiter, Saturn, and the date, with the zodiac and the Egyptian calendar around the outside.</desc>
<rect width="800" height="520" fill="#fbf8f2"/>
<text x='28.0' y='32.0' font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size='20' fill='#22201c' text-anchor='start' font-weight='700'>The front: a cosmos in rings</text>
<text x='28.0' y='52.0' font-family="'Liberation Serif', 'Iowan Old Style', Palatino, Georgia, serif" font-size='11.5' fill='#6b645a' text-anchor='start'>After the 2021 reconstruction by Tony Freeth and colleagues. The planetary rings are inferred mainly from inscriptions, not from surviving gears.</text>
