<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="332" viewBox="0 0 480 332" role="img" aria-labelledby="t d">
<title id="t">Each hour adds 10 miles</title>
<desc id="d">Straight line from 0 hours and 0 miles through 10, 20, 30, 40, 50, 60, 70, and 80 miles. Each hour adds 10.</desc>
<rect width="480" height="332" fill="#fbf8f2"/>
<style>text { font-family: Georgia, 'Iowan Old Style', Palatino, 'Palatino Linotype', serif; fill: #22201c; }</style>
<text x="24.0" y="28.0" font-size="22" fill="#22201c" text-anchor="start">Each hour adds 10 miles</text>
<text x="24.0" y="48.0" font-size="14" fill="#6b645a" text-anchor="start">Same addition every step. The line is straight.</text>
<line x1="54.0" y1="258.0" x2="456.0" y2="258.0" stroke="#22201c" stroke-width="1.2" stroke-linecap="round"/>
<line x1="54.0" y1="258.0" x2="54.0" y2="72.0" stroke="#22201c" stroke-width="1.2" stroke-linecap="round"/>
<text x="46.0" y="262.0" font-size="15" fill="#6b645a" text-anchor="end">0</text>
<text x="46.0" y="170.0" font-size="15" fill="#6b645a" text-anchor="end">40</text>
<text x="46.0" y="77.0" font-size="15" fill="#6b645a" text-anchor="end">80</text>
<text x="54.0" y="276.0" font-size="14" fill="#6b645a" text-anchor="middle">0</text>
<text x="255.0" y="276.0" font-size="14" fill="#6b645a" text-anchor="middle">4 hours</text>
<text x="456.0" y="276.0" font-size="14" fill="#6b645a" text-anchor="middle">8</text>
<polyline points="54.0,258.0 104.2,234.8 154.5,211.5 204.8,188.2 255.0,165.0 305.2,141.8 355.5,118.5 405.8,95.2 456.0,72.0" fill="none" stroke="#7a4b1e" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="54.0" cy="258.0" r="5.2" fill="#7a4b1e"/>
<text x="62.0" y="250.0" font-size="14" fill="#6b645a" text-anchor="start">start</text>
<circle cx="104.2" cy="234.8" r="5.2" fill="#7a4b1e"/>
<text x="104.2" y="222.8" font-size="16" fill="#22201c" text-anchor="middle">10</text>
<circle cx="154.5" cy="211.5" r="5.2" fill="#7a4b1e"/>
<text x="154.5" y="199.5" font-size="16" fill="#22201c" text-anchor="middle">20</text>
<circle cx="204.8" cy="188.2" r="5.2" fill="#7a4b1e"/>
<text x="204.8" y="176.2" font-size="16" fill="#22201c" text-anchor="middle">30</text>
<circle cx="255.0" cy="165.0" r="5.2" fill="#7a4b1e"/>
<text x="255.0" y="153.0" font-size="16" fill="#22201c" text-anchor="middle">40</text>
<circle cx="305.2" cy="141.8" r="5.2" fill="#7a4b1e"/>
<text x="305.2" y="129.8" font-size="16" fill="#22201c" text-anchor="middle">50</text>
