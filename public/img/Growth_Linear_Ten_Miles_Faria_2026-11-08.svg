<svg xmlns="http://www.w3.org/2000/svg" width="480" height="430" viewBox="0 0 480 430" role="img" aria-labelledby="t d">
<title id="t">Each hour adds 10 miles</title>
<desc id="d">Straight line from 0 hours and 0 miles through 10, 20, 30, 40, 50, 60, 70, and 80 miles. Each hour adds 10.</desc>
<rect width="480" height="430" fill="#fbf8f2"/>
<style>text { font-family: Georgia, 'Iowan Old Style', Palatino, 'Palatino Linotype', serif; fill: #22201c; }</style>
<text x="24.0" y="40.0" font-size="28" fill="#22201c" text-anchor="start">Each hour adds 10 miles</text>
<text x="24.0" y="68.0" font-size="16" fill="#6b645a" text-anchor="start">Same addition every step. The line is straight.</text>
<line x1="58.0" y1="360.0" x2="448.0" y2="360.0" stroke="#22201c" stroke-width="1.2" stroke-linecap="round"/>
