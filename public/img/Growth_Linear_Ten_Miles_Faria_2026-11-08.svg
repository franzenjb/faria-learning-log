<text x="50.0" y="239.0" font-size="15" fill="#6b645a" text-anchor="end">40</text>
<text x="50.0" y="113.0" font-size="15" fill="#6b645a" text-anchor="end">80</text>
<text x="58.0" y="396.0" font-size="15" fill="#6b645a" text-anchor="middle">0</text>
<text x="253.0" y="396.0" font-size="15" fill="#6b645a" text-anchor="middle">4 hours</text>
<text x="448.0" y="396.0" font-size="15" fill="#6b645a" text-anchor="middle">8</text>
<polyline points="58.0,360.0 106.8,328.5 155.5,297.0 204.2,265.5 253.0,234.0 301.8,202.5 350.5,171.0 399.2,139.5 448.0,108.0" fill="none" stroke="#7a4b1e" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="58.0" cy="360.0" r="5.2" fill="#7a4b1e"/>
<text x="66.0" y="352.0" font-size="14" fill="#6b645a" text-anchor="start">start</text>
