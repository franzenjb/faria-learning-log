<text x="155.5" y="285.0" font-size="16" fill="#22201c" text-anchor="middle">20</text>
<circle cx="204.2" cy="265.5" r="5.2" fill="#7a4b1e"/>
<text x="204.2" y="253.5" font-size="16" fill="#22201c" text-anchor="middle">30</text>
<circle cx="253.0" cy="234.0" r="5.2" fill="#7a4b1e"/>
<text x="253.0" y="222.0" font-size="16" fill="#22201c" text-anchor="middle">40</text>
<circle cx="301.8" cy="202.5" r="5.2" fill="#7a4b1e"/>
<text x="301.8" y="190.5" font-size="16" fill="#22201c" text-anchor="middle">50</text>
