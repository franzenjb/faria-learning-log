<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="176" viewBox="0 0 480 176" role="img" aria-labelledby="t d">
<title id="t">Three rooms</title><desc id="d">Three rooms, each marked 40 people. Three times 40 is 120.</desc>
<rect width="480" height="176" fill="#fbf8f2"/>
<style>text { font-family: Georgia, 'Iowan Old Style', Palatino, 'Palatino Linotype', serif; fill: #22201c; }</style>
<text x="16" y="28" font-size="20" fill="#22201c" text-anchor="start">Three rooms, forty people each</text>
<rect x="16" y="48" width="140" height="78" fill="#fbf8f2" stroke="#7a4b1e" stroke-width="1.6"/>
<text x="86.0" y="76" font-size="16" fill="#7a4b1e" text-anchor="middle">Room 1</text>
<text x="86.0" y="98" font-size="14" fill="#6b645a" text-anchor="middle">40 people</text>
<rect x="170" y="48" width="140" height="78" fill="#fbf8f2" stroke="#7a4b1e" stroke-width="1.6"/>
<text x="240.0" y="76" font-size="16" fill="#7a4b1e" text-anchor="middle">Room 2</text>
<text x="240.0" y="98" font-size="14" fill="#6b645a" text-anchor="middle">40 people</text>
<rect x="324" y="48" width="140" height="78" fill="#fbf8f2" stroke="#7a4b1e" stroke-width="1.6"/>
<text x="394.0" y="76" font-size="16" fill="#7a4b1e" text-anchor="middle">Room 3</text>
<text x="394.0" y="98" font-size="14" fill="#6b645a" text-anchor="middle">40 people</text>
<text x="16" y="156" font-size="14" fill="#6b645a" text-anchor="start">3 × 40 = 120. A teaching count, not a fire rule.</text></svg>