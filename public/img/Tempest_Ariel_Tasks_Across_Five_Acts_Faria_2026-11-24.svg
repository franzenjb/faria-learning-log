<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 318" role="img" aria-label="Ariel’s tasks across the five acts of The Tempest.">
  <rect width="900" height="318" fill="#fbf8f2"/>
  <style>
    .title { font-family: "Liberation Serif", Georgia, serif; font-size: 18px; fill: #7a4b1e; }
    .act { font-family: "Liberation Serif", Georgia, serif; font-size: 13px; fill: #7a4b1e; letter-spacing: 0.08em; }
    .item { font-family: "Liberation Serif", Georgia, serif; font-size: 12.2px; fill: #22201c; }
    .note { font-family: "Liberation Serif", Georgia, serif; font-size: 11.5px; fill: #6b645a; }
    .rule { stroke: #e6dfd2; stroke-width: 1; }
    .axis { stroke: #7a4b1e; stroke-width: 1.15; }
    .dot { fill: #7a4b1e; }
  </style>
  <text x="0" y="22" class="title">Ariel’s tasks, act by act</text>
  <text x="0" y="46" class="note">Every major turn in the plot is a job Prospero gives his spirit — until the last act, when the spirit gives the master a job.</text>
  <line x1="10" y1="86" x2="890" y2="86" class="axis"/>
<circle cx="80" cy="86" r="3.2" class="dot"/><text x="80" y="76" class="act" text-anchor="middle">ACT 1</text><line x1="170" y1="106" x2="170" y2="308" class="rule"/><text x="14" y="118" class="item">Raises the storm, then</text><text x="14" y="135.2" class="item">saves every passenger.</text><text x="14" y="152.39999999999998" class="item">Lands Ferdinand alone.</text><text x="14" y="169.59999999999997" class="item">Hides the King’s ship</text><text x="14" y="186.79999999999995" class="item">safely in harbor.</text><text x="14" y="203.99999999999994" class="item">As a sea-nymph, sings</text><text x="14" y="221.19999999999993" class="item">Ferdinand to Miranda.</text><circle cx="258" cy="86" r="3.2" class="dot"/><text x="258" y="76" class="act" text-anchor="middle">ACT 2</text><line x1="348" y1="106" x2="348" y2="308" class="rule"/><text x="192" y="118" class="item">Watches Antonio and</text><text x="192" y="135.2" class="item">Sebastian draw swords</text><text x="192" y="152.39999999999998" class="item">over the sleeping King</text><text x="192" y="169.59999999999997" class="item">and Gonzalo.</text><text x="192" y="186.79999999999995" class="item">Sings in Gonzalo’s ear.</text><text x="192" y="203.99999999999994" class="item">The old counselor wakes;</text><text x="192" y="221.19999999999993" class="item">the murder plot fails.</text><circle cx="436" cy="86" r="3.2" class="dot"/><text x="436" y="76" class="act" text-anchor="middle">ACT 3</text><line x1="526" y1="106" x2="526" y2="308" class="rule"/><text x="370" y="118" class="item">Helps lay a banquet</text><text x="370" y="135.2" class="item">before the shipwrecked</text><text x="370" y="152.39999999999998" class="item">lords, then makes it</text><text x="370" y="169.59999999999997" class="item">vanish.</text><text x="370" y="186.79999999999995" class="item">Appears as a harpy.</text><text x="370" y="203.99999999999994" class="item">Names them “three men</text><text x="370" y="221.19999999999993" class="item">of sin” and recalls the</text><text x="370" y="238.39999999999992" class="item">crime against Prospero.</text><circle cx="614" cy="86" r="3.2" class="dot"/><text x="614" y="76" class="act" text-anchor="middle">ACT 4</text><line x1="704" y1="106" x2="704" y2="308" class="rule"/><text x="548" y="118" class="item">Presents the wedding</text><text x="548" y="135.2" class="item">masque of spirits.</text><text x="548" y="152.39999999999998" class="item">Leads Caliban’s crew</text><text x="548" y="169.59999999999997" class="item">through briers into a</text><text x="548" y="186.79999999999995" class="item">filthy pool.</text><text x="548" y="203.99999999999994" class="item">Hangs out shining</text><text x="548" y="221.19999999999993" class="item">garments as a trap.</text><text x="548" y="238.39999999999992" class="item">Hunts them with spirit-</text><text x="548" y="255.5999999999999" class="item">hounds.</text><circle cx="792" cy="86" r="3.2" class="dot"/><text x="792" y="76" class="act" text-anchor="middle">ACT 5</text><text x="726" y="118" class="item">Reports the prisoners,</text><text x="726" y="135.2" class="item">especially Gonzalo in</text><text x="726" y="152.39999999999998" class="item">tears.</text><text x="726" y="169.59999999999997" class="item">Asks for pity: “Mine</text><text x="726" y="186.79999999999995" class="item">would, sir, were I</text><text x="726" y="203.99999999999994" class="item">human.”</text><text x="726" y="221.19999999999993" class="item">Fetches the ship and</text><text x="726" y="238.39999999999992" class="item">the sailors.</text><text x="726" y="255.5999999999999" class="item">Is promised calm seas,</text><text x="726" y="272.7999999999999" class="item">then set free.</text></svg>
